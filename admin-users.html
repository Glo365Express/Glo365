
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f8fc">
<title>GLO 365 - User Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#24364b;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
.wrap{max-width:1050px;margin:auto;padding:17px 13px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;gap:10px}
.top h1{font-size:20px;margin:0}
.top p{font-size:11px;color:#8291a3;margin:5px 0 0}
.btn{border:0;border-radius:8px;padding:9px 12px;background:#2196e8;color:#fff;font-size:11px;font-weight:bold;cursor:pointer}
.btn.secondary{background:#e8f3fc;color:#147fc5}
.btn.danger{background:#ffe9eb;color:#c63c4a}
.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.stat{background:#fff;border:1px solid #e4edf5;border-radius:11px;padding:12px}
.stat span{font-size:10px;color:#8291a3}
.stat strong{display:block;font-size:21px;color:#1687d2;margin-top:5px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{min-width:0;width:100%;padding:10px;border:1px solid #dce6ef;border-radius:8px;background:#fff;font-size:12px;outline-color:#2196e8}
.toolbar select{max-width:135px}
.message{display:none;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px}
.message.show{display:block}
.message.error{background:#fff0f0;color:#b92d3a}
.message.ok{background:#e8f7ef;color:#137b4b}
.user-list{display:grid;gap:8px}
.user-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;border:1px solid #e4edf5;border-radius:11px;background:#fff;min-width:0}
.user-card:nth-child(even){background:#eaf5ff;border-color:#d5eafa}
.user-info{min-width:0;flex:1}
.user-name{font-size:13px;font-weight:bold;color:#203c58;overflow-wrap:anywhere}
.user-meta{font-size:10px;color:#8291a3;margin-top:5px;line-height:1.6;overflow-wrap:anywhere}
.user-balance{font-size:12px;font-weight:bold;color:#1687d2;margin-top:5px}
.user-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:9px;font-weight:bold;padding:5px 8px;border-radius:20px;background:#e4f7ec;color:#16834f}
.pill.off{background:#ffe9eb;color:#c63c4a}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.small{padding:7px 9px;font-size:10px}
.empty{text-align:center;padding:25px;color:#8291a3;font-size:12px;background:#fff;border-radius:10px}
.notice{margin-top:13px;padding:11px;background:#eaf5fd;border-radius:9px;color:#52738c;font-size:10px;line-height:1.6}
.modal{position:fixed;inset:0;background:#10283c88;display:none;align-items:center;justify-content:center;padding:13px;z-index:5}
.modal.show{display:flex}
.dialog{background:#fff;border-radius:13px;padding:17px;width:min(480px,100%);max-height:85vh;overflow:auto}
.dialog h2{font-size:17px;margin:0 0 13px}
.dialog p{font-size:12px;margin:8px 0;overflow-wrap:anywhere}
.field{margin:11px 0}
.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px;border:1px solid #dce6ef;border-radius:8px;font-size:12px}
.history{display:flex;justify-content:space-between;gap:10px;padding:9px;border:1px solid #e8eef4;border-radius:8px;margin:7px 0;font-size:11px}
.credit{color:#159b63;font-weight:bold}
.debit{color:#df4d5b;font-weight:bold}
.muted{color:#8291a3}
@media(max-width:600px){
 .wrap{padding:13px 9px 30px}
 .top h1{font-size:17px}
 .stats{gap:6px}
 .stat{padding:10px}
 .stat strong{font-size:18px}
 .user-card{align-items:flex-start;padding:11px;gap:7px}
 .user-right{flex-direction:column;align-items:flex-end}
 .actions{justify-content:flex-end}
 .toolbar{gap:6px}
 .toolbar select{max-width:112px}
}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
 <div>
  <h1>GLO 365 · Users</h1>
  <p>Manage accounts and DEMO points</p>
 </div>
 <button class="btn secondary" id="refreshBtn">↻ Refresh</button>
</header>

<section class="stats">
 <div class="stat"><span>Total Users</span><strong id="totalUsers">—</strong></div>
 <div class="stat"><span>Active</span><strong id="activeUsers">—</strong></div>
 <div class="stat"><span>Suspended</span><strong id="suspendedUsers">—</strong></div>
</section>

<div class="toolbar">
 <input id="search" placeholder="Search username or email">
 <select id="statusFilter">
  <option value="">All Status</option>
  <option value="active">Active</option>
  <option value="suspended">Suspended</option>
 </select>
 <button class="btn" id="searchBtn">Search</button>
</div>

<div id="message" class="message"></div>
<section class="user-list" id="usersBody">
 <div class="empty">Loading users...</div>
</section>

<div class="notice">
 <b>DEMO POINTS NOTICE</b><br>
 Points are demo-only and are not real money. All transactions are recorded in PostgreSQL. Admin accounts are protected.
</div>
</main>

<div class="modal" id="modal">
 <div class="dialog">
  <h2 id="modalTitle">User details</h2>
  <div id="modalBody"></div>
  <button class="btn secondary" id="closeModal">Close</button>
 </div>
</div>

<script>
"use strict";
(()=>{
const API="https://glo365.onrender.com/api";
const TOKEN_KEY="glo365_token";
const $=id=>document.getElementById(id);
let users=[];

function token(){
 try{return sessionStorage.getItem(TOKEN_KEY)||""}
 catch(e){return ""}
}

async function api(path,opts={}){
 const t=token();
 if(!t){
  location.replace("login.html");
  throw Error("Please login first.");
 }
 let res;
 try{
  res=await fetch(API+path,{
   ...opts,
   credentials:"include",
   headers:{
    "Accept":"application/json",
    ...(opts.body?{"Content-Type":"application/json"}:{}),
    "Authorization":"Bearer "+t,
    ...(opts.headers||{})
   }
  });
 }catch(e){throw Error("Cannot connect to server.")}
 let data={};
 try{data=await res.json()}catch(e){}
 if(res.status===401){
  sessionStorage.removeItem(TOKEN_KEY);
  location.replace("login.html");
  throw Error("Session expired. Please login again.");
 }
 if(!res.ok||data.success===false)
  throw Error(data.message||"Request failed.");
 return data.data||data;
}

function msg(text,error=false){
 const el=$("message");
 el.textContent=text;
 el.className="message show "+(error?"error":"ok");
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function money(v){
 return (Number(v)||0).toLocaleString("en-US",{
  minimumFractionDigits:2,maximumFractionDigits:2
 });
}

function date(v){
 if(!v)return "—";
 const d=new Date(v);
 return isNaN(d)?"—":d.toLocaleDateString("en-GB");
}

function render(){
 const filter=$("statusFilter").value;
 const query=$("search").value.trim().toLowerCase();
 const list=users.filter(u=>{
  const matchesStatus=!filter||u.status===filter;
  const matchesSearch=!query||
   String(u.username||"").toLowerCase().includes(query)||
   String(u.email||"").toLowerCase().includes(query);
  return matchesStatus&&matchesSearch;
 });

 $("totalUsers").textContent=users.length;
 $("activeUsers").textContent=users.filter(u=>u.status==="active").length;
 $("suspendedUsers").textContent=users.filter(u=>u.status==="suspended").length;

 const body=$("usersBody");
 body.replaceChildren();

 if(!list.length){
  body.innerHTML='<div class="empty">No users found.</div>';
  return;
 }

 list.forEach(u=>{
  const admin=String(u.role).toLowerCase()==="admin";
  const card=document.createElement("article");
  card.className="user-card";

  card.innerHTML=`
   <div class="user-info">
    <div class="user-name">@${esc(u.username)}</div>
    <div class="user-meta">
     ID: ${esc(u.id)} · ${esc(u.email)}<br>
     ${esc(u.role)} · Joined: ${date(u.created_at)}
    </div>
    <div class="user-balance">${money(u.balance)} DEMO Points</div>
   </div>
   <div class="user-right">
    <span class="pill ${u.status==="active"?"":"off"}">${esc(u.status)}</span>
    <div class="actions">
     <button class="btn secondary small" data-action="view" data-id="${esc(u.id)}">View</button>
     ${!admin?`
      <button class="btn ${u.status==="active"?"danger":"secondary"} small"
       data-action="status" data-id="${esc(u.id)}"
       data-status="${u.status==="active"?"suspended":"active"}">
       ${u.status==="active"?"Disable":"Activate"}
      </button>
      <button class="btn small" data-action="credit" data-id="${esc(u.id)}">+ Points</button>
     `:`<span class="muted" style="font-size:10px">Protected</span>`}
    </div>
   </div>
  `;
  body.append(card);
 });
}

async function load(){
 $("usersBody").innerHTML='<div class="empty">Loading users...</div>';
 try{
  const d=await api("/admin/users?search="+encodeURIComponent($("search").value.trim()));
  users=Array.isArray(d.users)?d.users:[];
  render();
 }catch(e){
  msg(e.message,true);
  $("usersBody").innerHTML='<div class="empty">Could not load users.</div>';
 }
}

function open(title,html){
 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=html;
 $("modal").classList.add("show");
}

async function view(id){
 try{
  const d=await api("/admin/users/"+encodeURIComponent(id));
  const u=d.user||{};
  const rows=Array.isArray(d.transactions)?d.transactions:[];
  open("User · @"+(u.username||""),`
   <p><b>Email:</b> ${esc(u.email)}</p>
   <p><b>Role:</b> ${esc(u.role)} · <b>Status:</b> ${esc(u.status)}</p>
   <p><b>Balance:</b> ${money(u.balance)} DEMO Points</p>
   <h3 style="font-size:13px;margin-top:16px">Point History</h3>
   ${rows.length?rows.map(x=>`
    <div class="history">
     <span>${esc(x.description||x.type)}<br>
      <small class="muted">${date(x.created_at)}</small>
     </span>
     <b class="${Number(x.amount)>=0?"credit":"debit"}">${money(x.amount)}</b>
    </div>
   `).join(""):'<p class="muted">No transactions.</p>'}
  `);
 }catch(e){msg(e.message,true)}
}

async function status(id,next){
 if(!confirm("Change this account status to "+next+"?"))return;
 try{
  await api("/admin/users/"+encodeURIComponent(id)+"/status",{
   method:"PATCH",
   body:JSON.stringify({status:next})
  });
  msg("Account status updated.");
  await load();
 }catch(e){msg(e.message,true)}
}

function creditForm(id){
 open("Add DEMO Points",`
  <form id="creditForm">
   <div class="field">
    <label>Point amount</label>
    <input name="amount" type="number" min="0.01" max="1000000" step="0.01" required>
   </div>
   <div class="field">
    <label>Description</label>
    <textarea name="description" rows="2" maxlength="200" placeholder="Admin demo point credit"></textarea>
   </div>
   <button class="btn" type="submit">Credit Points</button>
  </form>
 `);

 $("creditForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const fd=new FormData(e.currentTarget);
  const amount=Number(fd.get("amount"));
  if(!(amount>0))return;
  const submit=e.currentTarget.querySelector("button[type=submit]");
  submit.disabled=true;
  try{
   const d=await api("/admin/users/"+encodeURIComponent(id)+"/points",{
    method:"POST",
    body:JSON.stringify({
     amount,
     description:fd.get("description")
    })
   });
   $("modal").classList.remove("show");
   msg(d.message||"Points credited.");
   await load();
  }catch(err){
   msg(err.message,true);
   submit.disabled=false;
  }
 });
}

$("usersBody").addEventListener("click",e=>{
 const b=e.target.closest("button[data-action]");
 if(!b)return;
 const {action,id,status}=b.dataset;
 if(action==="view")view(id);
 if(action==="status")statusChange(id,status);
 if(action==="credit")creditForm(id);
});

async function statusChange(id,next){await status(id,next)}

$("searchBtn").addEventListener("click",load);
$("refreshBtn").addEventListener("click",load);
$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")load();
});
$("statusFilter").addEventListener("change",render);
$("closeModal").addEventListener("click",()=>$("modal").classList.remove("show"));
$("modal").addEventListener("click",e=>{
 if(e.target===$("modal"))$("modal").classList.remove("show");
});

load();
})();
</script>
</body>
</html>
