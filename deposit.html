
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17112f">
<title>GLO 365 - Deposit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f3f3;color:#292929;min-height:100vh}
.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding-bottom:30px}
header{height:72px;background:linear-gradient(110deg,#100a2c,#211638);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:22px;font-weight:bold}
.back{position:absolute;left:20px;color:#fff;text-decoration:none;font-size:30px}
.page{padding:20px 14px}
.card{background:#fff;border-radius:18px;padding:17px 15px;margin-bottom:15px;box-shadow:0 5px 24px #0000000d}
.title{font-size:18px;font-weight:900;margin-bottom:18px}
.title:before{content:"";display:inline-block;width:10px;height:10px;background:#ef4056;border-radius:50%;margin-right:7px}
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.method{height:88px;border:1px solid #ddd;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:9px;cursor:pointer;position:relative;min-width:0}
.method.active{border:2px solid #e54b67;background:#fff0f2}
.method img{width:51px;height:51px;object-fit:contain;flex-shrink:0}
.method-name{font-size:12px;font-weight:800;text-align:left;overflow-wrap:anywhere}
.check{display:none;position:absolute;right:7px;top:5px;color:#e63855;font-weight:bold}
.method.active .check{display:block}
.field{margin-top:10px}
label{display:block;font-weight:900;font-size:17px;margin-bottom:12px}
input{width:100%;height:60px;border:1px solid #ddd;border-radius:9px;padding:0 15px;font-size:16px;outline:none}
input:focus{border-color:#2196e8;box-shadow:0 0 0 3px #2196e81a}
.hint{font-size:12px;color:#927e7e;margin-top:9px}
.bottom{position:sticky;bottom:0;background:#fff;border:1px solid #eee;padding:14px 16px 20px;box-shadow:0 -5px 20px #00000008}
.summary{display:flex;justify-content:space-around;text-align:center;margin-bottom:18px}
.summary div{flex:1;border-right:1px solid #ddd;font-size:12px;color:#888}
.summary div:last-child{border:0}
.summary strong{display:block;color:#222;font-size:17px;margin-top:6px}
.btn{width:100%;height:57px;border:0;border-radius:35px;background:linear-gradient(100deg,#ff9eaa,#f17e91);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 5px 12px #f17e9140}
.btn:disabled{opacity:.5}
.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#211638;color:#fff;padding:13px 18px;border-radius:10px;font-size:13px;z-index:200;max-width:90%;text-align:center}
.splash{position:fixed;inset:0;background:linear-gradient(140deg,#100a2c,#211638);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.splash img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:25px;padding:13px;margin-bottom:22px}
.splash h2{font-size:22px}
.splash p{font-size:13px;color:#ddd;margin-top:10px}
.loader{width:42px;height:42px;border:4px solid #ffffff40;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-top:25px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
@media(max-width:360px){.method{gap:6px;padding:7px}.method img{width:42px;height:42px}.method-name{font-size:11px}}
</style>
</head>
<body>

<div class="app">
<header>
<a class="back" href="profile.html">‹</a>
Deposit
</header>

<div class="page">
<section class="card">
<div class="title">Deposit Method</div>
<div class="methods" id="methods">
<div style="grid-column:1/-1;text-align:center;padding:20px;color:#888">Loading payment methods...</div>
</div>
</section>

<section class="card">
<div class="title">Deposit Amount</div>
<div class="field">
<label for="amount">৳ Deposit Amount</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="Please enter amount" inputmode="decimal">
<div class="hint" id="limitText">Please enter your deposit amount.</div>
</div>
</section>
</div>

<div class="bottom">
<div class="summary">
<div>DEPOSIT<strong id="depositAmount">0.00</strong></div>
<div>GET<strong id="getAmount">0.00</strong></div>
<div>BONUS<strong>-</strong></div>
</div>
<button class="btn" id="continueBtn" disabled>Confirm Deposit</button>
</div>
</div>

<div class="splash hidden" id="splash">
<img id="splashLogo" src="" alt="Payment logo">
<h2 id="splashName">Loading...</h2>
<p>Preparing secure deposit page</p>
<div class="loader"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const API_BASE_URL="https://glo365.onrender.com/api";
const TOKEN_KEY="glo365_token";

let methods=[];
let selectedMethod=null;
let toastTimer=null;

const CHANNELS={
 bkash:{
  label:"bKash",
  aliases:["bkash","b-kash"],
  logo:"https://cdn.simpleicons.org/bkash/E2136E"
 },
 nagad:{
  label:"Nagad",
  aliases:["nagad"],
  logo:"https://cdn.simpleicons.org/nagad/F6921E"
 },
 binance:{
  label:"Binance",
  aliases:["binance"],
  logo:"https://cdn.simpleicons.org/binance/F0B90B"
 },
 tether:{
  label:"Tether USDT",
  aliases:["tether","usdt"],
  logo:"https://cdn.simpleicons.org/tether/50AF95"
 },
 redotpay:{
  label:"RedotPay",
  aliases:["redotpay","redot pay"],
  logo:""
 }
};

function getToken(){
 return sessionStorage.getItem(TOKEN_KEY)||"";
}

function showToast(message){
 const el=document.getElementById("toast");
 el.textContent=message;
 el.style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.style.display="none",3500);
}

async function api(path,options={}){
 const headers={...(options.headers||{})};
 if(getToken())headers.Authorization="Bearer "+getToken();
 if(options.body)headers["Content-Type"]="application/json";

 const response=await fetch(API_BASE_URL+path,{
  ...options,
  headers,
  credentials:"include",
  cache:"no-store"
 });

 let data={};
 try{data=await response.json()}catch(e){}

 if(response.status===401){
  sessionStorage.removeItem(TOKEN_KEY);
  throw new Error("Session expired. Please login again.");
 }

 if(!response.ok||data.success===false){
  throw new Error(data.message||"Server request failed.");
 }

 return data;
}

function identifyChannel(method){
 const text=(
  String(method.name||"")+" "+
  String(method.preset||"")+" "+
  String(method.label||"")
 ).toLowerCase().replace(/[^a-z0-9]/g,"");

 for(const [key,config] of Object.entries(CHANNELS)){
  if(config.aliases.some(alias=>{
   const normalized=alias.replace(/[^a-z0-9]/g,"");
   return text.includes(normalized);
  }))return key;
 }
 return "";
}

function getLogo(method,type){
 return method.logo_url||
        method.image_url||
        method.logo||
        CHANNELS[type].logo;
}

function renderMethods(){
 const box=document.getElementById("methods");
 box.replaceChildren();

 const order=["bkash","nagad","binance","tether","redotpay"];

 order.forEach(type=>{
  const method=methods.find(m=>identifyChannel(m)===type);
  if(!method)return;

  const button=document.createElement("button");
  button.type="button";
  button.className="method";
  button.setAttribute("aria-label",CHANNELS[type].label);

  const img=document.createElement("img");
  img.src=getLogo(method,type);
  img.alt=CHANNELS[type].label+" logo";

  img.onerror=()=>{
   img.style.display="none";
   const fallback=document.createElement("span");
   fallback.textContent=type==="tether"?"₮":type==="binance"?"B":type==="bkash"?"bK":type==="nagad"?"N":"R";
   fallback.style.cssText="font-size:25px;font-weight:900;color:#d51b72;min-width:42px;text-align:center";
   button.insertBefore(fallback,button.firstChild);
  };

  const name=document.createElement("span");
  name.className="method-name";
  name.textContent=CHANNELS[type].label;

  const check=document.createElement("span");
  check.className="check";
  check.textContent="✓";

  button.append(img,name,check);

  button.addEventListener("click",()=>{
   selectedMethod=method;
   document.querySelectorAll(".method").forEach(el=>el.classList.remove("active"));
   button.classList.add("active");
   updateSummary();
  });

  box.append(button);
 });

 if(!box.children.length){
  const empty=document.createElement("div");
  empty.className="empty";
  empty.style.cssText="grid-column:1/-1;text-align:center;padding:20px;color:#888";
  empty.textContent="No active payment channels available.";
  box.append(empty);
 }
}

function updateSummary(){
 const amount=Number(document.getElementById("amount").value)||0;
 document.getElementById("depositAmount").textContent=amount.toFixed(2);
 document.getElementById("getAmount").textContent=amount.toFixed(2);
 document.getElementById("continueBtn").disabled=!(selectedMethod&&amount>0);
}

document.getElementById("amount").addEventListener("input",updateSummary);

document.getElementById("continueBtn").addEventListener("click",()=>{
 const amount=Number(document.getElementById("amount").value);

 if(!selectedMethod){
  showToast("Please select a payment channel.");
  return;
 }

 if(!Number.isFinite(amount)||amount<=0){
  showToast("Please enter a valid amount.");
  return;
 }

 const type=identifyChannel(selectedMethod);
 const logo=getLogo(selectedMethod,type);

 const pending={
  payment_method_id:Number(selectedMethod.id),
  method_name:CHANNELS[type].label,
  method_type:type,
  logo_url:logo,
  amount:amount,
  currency:selectedMethod.currency||"BDT",
  created_at:Date.now()
 };

 sessionStorage.setItem("glo365_pending_deposit",JSON.stringify(pending));

 document.getElementById("splashLogo").src=logo||"";
 document.getElementById("splashName").textContent=CHANNELS[type].label;
 document.getElementById("splash").classList.remove("hidden");

 setTimeout(()=>{
  location.href="deposit-confarm.html";
 },3000);
});

async function initialize(){
 try{
  if(!getToken()){
   location.href="index.html";
   return;
  }

  const [me,walletData,methodData]=await Promise.all([
   api("/auth/me"),
   api("/wallet"),
   api("/public/payment-methods")
  ]);

  const all=Array.isArray(methodData.methods)?methodData.methods:[];

  // Only the five requested active channels are displayed.
  methods=all.filter(m=>identifyChannel(m)!=="");

  renderMethods();

 }catch(error){
  showToast(error.message);
  if(/login|session|token/i.test(error.message)){
   setTimeout(()=>location.href="index.html",1500);
  }
 }
}

initialize();
</script>
</body>
</html>
