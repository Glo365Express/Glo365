<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffb900">
<title>GLO 365 - Result Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f2f3f5;color:#202127}
.app{max-width:1050px;margin:auto;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-size:25px;font-weight:900}.brand span{color:#e6a600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,a.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.back{background:#202127;color:#fff}.logout{background:#ffe4e4;color:#bd2525}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:17px;box-shadow:0 4px 16px #00000008}
.intro{margin-bottom:17px}.intro h1{font-size:21px;margin-bottom:7px}.intro p{font-size:12px;color:#858585;line-height:1.6}
.country-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.country-card{position:relative;overflow:hidden;isolation:isolate;min-height:135px;border:0;border-radius:17px;padding:16px;display:flex;align-items:center;gap:12px;text-align:left;color:white;box-shadow:0 7px 17px #00000016;transition:.2s;cursor:pointer;width:100%}
.country-card:before{content:"";position:absolute;z-index:-1;width:145px;height:145px;border-radius:50%;right:-55px;top:-70px;background:#ffffff20}
.country-card:after{content:"";position:absolute;z-index:-1;width:100px;height:100px;border-radius:50%;right:30px;bottom:-75px;background:#ffffff15}
.country-card:active{transform:scale(.98)}
.thai{background:linear-gradient(130deg,#a81432,#ef405c)}
.malaysia{background:linear-gradient(130deg,#064a9d,#1597f0)}
.singapore{background:linear-gradient(130deg,#08766b,#23b99b)}
.taiwan{background:linear-gradient(130deg,#4930a7,#9273ff)}
.laos{background:linear-gradient(130deg,#a9470b,#f39a25)}
.flag{width:55px;height:55px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:15px;background:#ffffff25;border:1px solid #ffffff55;font-size:32px}
.info{min-width:0;flex:1}.info small{display:block;font-size:9px;letter-spacing:1px;font-weight:900;margin-bottom:7px;color:#ffffffcf}
.info strong{display:block;font-size:15px;line-height:1.35}.info em{display:block;font-style:normal;font-size:10px;margin-top:7px;color:#ffffffd9}
.arrow{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff30;font-size:20px;flex-shrink:0}
.footer{text-align:center;color:#aaa;font-size:11px;padding:20px}
.loading{position:fixed;inset:0;background:#f2f3f5;display:flex;align-items:center;justify-content:center;z-index:10;font-size:14px;color:#555}
@media(max-width:600px){.app{padding:12px}.brand{font-size:23px}.country-grid{grid-template-columns:1fr}.country-card{min-height:112px}.card{padding:15px}}
</style>
</head>
<body>
<div class="loading" id="loading">Checking admin access...</div>
<main class="app" id="app" style="display:none">
<header class="header">
 <div class="brand">GLO <span>365</span> <small style="font-size:13px;color:#777">/ Result Admin</small></div>
 <div class="actions">
  <a class="btn back" href="admin.html">← Dashboard</a>
  <button class="logout" id="logoutBtn" type="button">Logout</button>
 </div>
</header>

<section class="card">
 <div class="intro">
  <h1>🌍 Result Management</h1>
  <p>একটি দেশ নির্বাচন করুন। নির্বাচিত দেশের আলাদা Admin পেজ থেকে ফলাফল Publish করতে পারবেন।</p>
 </div>

 <div class="country-grid">
  <button type="button" class="country-card thai" data-page="thai.html">
   <span class="flag">🇹🇭</span>
   <span class="info"><small>THAILAND</small><strong>Thai Government Lotto</strong><em>Publish Thailand Results</em></span>
   <span class="arrow">›</span>
  </button>

  <button type="button" class="country-card malaysia" data-page="malaysia.html">
   <span class="flag">🇲🇾</span>
   <span class="info"><small>MALAYSIA</small><strong>Malaysia Toto</strong><em>Publish Malaysia 2D / 3D / 4D</em></span>
   <span class="arrow">›</span>
  </button>

  <button type="button" class="country-card singapore" data-page="singapore.html">
   <span class="flag">🇸🇬</span>
   <span class="info"><small>SINGAPORE</small><strong>Singapore Pools</strong><em>Publish Singapore Results</em></span>
   <span class="arrow">›</span>
  </button>

  <button type="button" class="country-card taiwan" data-page="taiwan.html">
   <span class="flag">🇹🇼</span>
   <span class="info"><small>TAIWAN</small><strong>Taiwan Lottery</strong><em>Publish Taiwan Results</em></span>
   <span class="arrow">›</span>
  </button>

  <button type="button" class="country-card laos" data-page="laos.html">
   <span class="flag">🇱🇦</span>
   <span class="info"><small>LAOS</small><strong>Laos Government Lotto</strong><em>Publish Laos Results</em></span>
   <span class="arrow">›</span>
  </button>
 </div>
</section>

<footer class="footer">© 2026 GLO 365. All Rights Reserved.</footer>
</main>

<script>
'use strict';
const API_BASE_URL='https://glo365.onrender.com/api';
const TOKEN_KEY='glo365_token';
function getToken(){return sessionStorage.getItem(TOKEN_KEY)||'';}

async function api(path,options={}){
 const headers={'Accept':'application/json','Content-Type':'application/json',...(options.headers||{})};
 const token=getToken();
 if(token)headers.Authorization='Bearer '+token;
 const response=await fetch(API_BASE_URL+path,{...options,headers,credentials:'include'});
 let data={};
 try{data=await response.json();}catch(e){}
 if(!response.ok)throw new Error(data.message||data.error||'Request failed ('+response.status+')');
 return data;
}

async function checkAdmin(){
 if(!getToken()){location.href='login.html';return false;}
 try{
  const data=await api('/auth/me');
  const user=data.user||data.profile||data;
  if(String(user.role||'').toLowerCase()!=='admin'){
   location.href='login.html';return false;
  }
  return true;
 }catch(error){
  sessionStorage.removeItem(TOKEN_KEY);
  location.href='login.html';
  return false;
 }
}

document.querySelectorAll('.country-card').forEach(card=>{
 card.addEventListener('click',()=>{
  location.href='result-admin/'+card.dataset.page;
 });
});

document.getElementById('logoutBtn').addEventListener('click',async()=>{
 try{await api('/auth/logout',{method:'POST'});}catch(error){}
 sessionStorage.removeItem(TOKEN_KEY);
 location.href='login.html';
});

(async()=>{
 const allowed=await checkAdmin();
 document.getElementById('loading').style.display='none';
 if(allowed)document.getElementById('app').style.display='block';
})();
</script>
</body>
</html>
