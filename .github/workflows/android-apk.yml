
name: Build GLO 365 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project folders
        run: |
          mkdir -p app/src/main/java/com/glo365/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi

          if [ ! -f glo365-icon.png ]; then
            echo "ERROR: glo365-icon.png was not found in repository root."
            exit 1
          fi

          cp glo365-icon.png app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GLO365"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.glo365.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.glo365.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.kt
        run: |
          cat > app/src/main/java/com/glo365/app/MainActivity.kt <<'EOF'
          package com.glo365.app

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {

              private lateinit var webView: WebView

              private val homeUrl = "https://glo365.online"

              private val allowedHosts = setOf(
                  "glo365.online",
                  "www.glo365.online",
                  "glo365.onrender.com"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.databaseEnabled = true
                  webView.settings.allowFileAccess = false
                  webView.settings.allowContentAccess = false
                  webView.settings.javaScriptCanOpenWindowsAutomatically = false

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance()
                      .setAcceptThirdPartyCookies(webView, false)

                  webView.webChromeClient = WebChromeClient()

                  webView.webViewClient = object : WebViewClient() {

                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {

                          val uri = request.url

                          if (uri.scheme == "https" &&
                              uri.host in allowedHosts) {
                              return false
                          }

                          if (uri.scheme == "http" ||
                              uri.scheme == "https") {
                              startActivity(
                                  Intent(Intent.ACTION_VIEW, uri)
                              )
                          }

                          return true
                      }
                  }

                  if (savedInstanceState == null) {
                      webView.loadUrl(homeUrl)
                  } else {
                      webView.restoreState(savedInstanceState)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  if (::webView.isInitialized) {
                      webView.destroy()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">GLO 365</string>
          </resources>
          EOF

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196E8</item>
                  <item name="android:statusBarColor">#2196E8</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

      - name: Build GLO 365 APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLO-365-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
