<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2196e8">
<title>GLO 365 - Live Results</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2196e8;--blue-dark:#087acb;--blue-light:#eaf5fd;--border:#d8e9f5;--text:#18344b;--muted:#71869a;--bg:#f1f7fc;--navy:#102d49}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding-bottom:145px}
header{width:100%;min-height:90px;background:#fff;display:flex;justify-content:center;align-items:center;padding:8px 5px;overflow:hidden;border-bottom:1px solid var(--border)}
.header-ad{width:100%;min-height:70px;display:flex;justify-content:center;align-items:center;overflow:hidden}
.header-ad iframe{max-width:100%;border:0}
.search-area{padding:15px 13px 5px}.search-box{width:100%;height:52px;border:1px solid var(--border);outline:none;border-radius:10px;background:#f5faff;padding:0 15px;font-size:15px;color:var(--text)}
.search-box:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2196e820}
.date-area{padding:20px 12px 10px;text-align:center}.date-title{font-size:21px;font-weight:900;margin-bottom:17px;color:var(--blue-dark)}
.previous-btn{border:1px solid var(--border);background:var(--blue-light);color:var(--blue-dark);font-size:14px;font-weight:bold;padding:9px 14px;border-radius:25px;cursor:pointer}
.previous-btn span{display:inline-grid;place-items:center;width:25px;height:25px;margin-left:6px;background:var(--blue);color:white;border-radius:50%}
.result-content{padding:5px 13px 25px}.result-section{text-align:center;margin-top:22px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px 8px}
.result-label{color:var(--blue-dark);font-size:18px;font-weight:900;margin-bottom:17px}.first-result{font-size:65px;font-weight:900;letter-spacing:2px;color:var(--navy);padding:4px 0 12px;overflow-wrap:anywhere}
.two-result{font-size:56px;font-weight:900;color:var(--blue-dark);padding:4px 0 12px}.three-results{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 8px}
.three-results div{font-size:43px;font-weight:900;color:var(--blue-dark);background:var(--blue-light);border:1px solid var(--border);border-radius:10px;padding:10px 5px}
.result-info{text-align:center;color:var(--muted);font-size:12px;padding:15px 10px;white-space:pre-line}
.ad-banner{margin:12px 13px 20px;min-height:90px;border:1px solid var(--border);border-radius:12px;background:#f8fcff;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.ad-content{width:100%;text-align:center}.ad-label{display:block;font-size:9px;color:#8298aa;margin-bottom:7px;letter-spacing:1px;font-weight:bold}.ad-frame{width:100%;min-height:50px;display:flex;justify-content:center;align-items:center;overflow:hidden}.ad-frame iframe{max-width:100%;border:0}
.result-tabs{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--navy);z-index:9;box-shadow:0 -2px 8px #00000012}
.result-tabs button{flex:1;padding:13px 5px;background:none;border:0;color:#b7c9d8;font-size:15px;font-weight:bold;cursor:pointer}.result-tabs button.active{color:white;border-bottom:3px solid #55b7ff;background:#ffffff10}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:white;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:10px 4px 15px;z-index:10}
nav button{flex:1;border:0;background:none;color:#8295a6;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}nav button strong{font-size:23px}nav button.active{color:var(--blue-dark);font-weight:bold}
.nav-profile-avatar{width:25px;height:25px;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:1.5px solid var(--blue);font-size:19px;line-height:1;flex-shrink:0}.nav-profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.modal{display:none;position:fixed;inset:0;background:#071c2dcc;z-index:30;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
.modal-box{background:white;width:100%;max-width:450px;max-height:85vh;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border)}
.modal-header{background:var(--blue);color:white;padding:17px;display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:bold}.close-btn{border:0;background:none;color:white;font-size:30px;cursor:pointer}
.date-list{overflow-y:auto}.date-item{width:100%;padding:18px 15px;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid #edf3f8;background:white;text-align:left;font-size:14px;color:var(--text);cursor:pointer}
.date-item.selected{color:var(--blue-dark);font-weight:bold;background:#f1f8fe}.radio{width:23px;height:23px;border:2px solid var(--blue);border-radius:50%;display:grid;place-items:center;flex-shrink:0}.date-item.selected .radio:after{content:"";width:11px;height:11px;border-radius:50%;background:var(--blue)}
.statistics{display:none;padding:20px 13px}.stat-card{padding:18px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:12px}.stat-card h3{font-size:15px;margin-bottom:12px;color:var(--blue-dark)}.stat-card p{font-size:14px;color:#61788b;line-height:1.8;white-space:pre-line}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:14px}
@media(max-width:380px){.date-title{font-size:18px}.first-result{font-size:52px}.two-result{font-size:45px}.three-results div{font-size:35px}.result-label{font-size:17px}.result-tabs button{font-size:13px}.ad-banner{padding:8px;min-height:85px}}
</style>
</head>
<body>
<div class="app">
<header><div class="header-ad">
<script>var atOptions={'key':'ab837cf0ea9c26ae43b7bc4e05a0b5de','format':'iframe','height':50,'width':320,'params':{}};</script>
<script src="https://bicea.org/22/ab837cf0ea9c26ae43b7bc4e05a0b5de"></script>
</div></header>
<div class="search-area"><input class="search-box" id="searchInput" type="search" placeholder="🔍 Search result or draw date..."></div>
<section class="date-area"><div class="date-title" id="drawDate">Draw Date: Loading...</div><button class="previous-btn" onclick="openHistory()">Previous Results <span>⌄</span></button></section>
<section id="resultsContent" class="result-content">
 <div class="result-section"><div class="result-label">1st Prize</div><div class="first-result" id="firstPrize">XXXXXX</div></div>
 <div class="result-section"><div class="result-label">Last 2 Digits</div><div class="two-result" id="lastTwo">XX</div></div>
 <div class="result-section"><div class="result-label">Front 3 Digits</div><div class="three-results"><div id="frontThree1">XXX</div><div id="frontThree2">XXX</div></div></div>
 <div class="result-info" id="resultInfo">Connecting to server...</div>
</section>
<section class="ad-banner" id="resultsAdBanner"><div class="ad-content"><span class="ad-label">ADVERTISEMENT</span><div class="ad-frame">
<script>var atOptions={'key':'ab837cf0ea9c26ae43b7bc4e05a0b5de','format':'iframe','height':50,'width':320,'params':{}};</script>
<script src="https://bicea.org/22/ab837cf0ea9c26ae43b7bc4e05a0b5de"></script>
</div></div></section>
<section id="statisticsContent" class="statistics"><div class="stat-card"><h3>📊 Result Statistics</h3><p id="statisticsText">Select a published draw to view statistics.</p></div><div class="stat-card"><h3>📅 Available Draws</h3><p id="drawCount">0 published results</p></div></section>
<div class="modal" id="historyModal"><div class="modal-box"><div class="modal-header"><span>Previous Results</span><button class="close-btn" onclick="closeHistory()">×</button></div><div class="date-list" id="dateList"></div></div></div>
<nav>
<button onclick="location.href='home.html'"><strong>⌂</strong>Home</button>
<button onclick="location.href='mybets.html'"><strong>🎯</strong>My Bets</button>
<button class="active" onclick="location.href='results.html'"><strong>🏆</strong>Results</button>
<button onclick="location.href='profile.html'"><strong class="nav-profile-avatar" id="navProfileAvatar">♙</strong>Profile</button>
</nav>
<div class="result-tabs"><button id="resultTab" class="active" onclick="switchTab('results')">Results</button><button id="statsTab" onclick="switchTab('statistics')">Statistics</button></div>
</div>
<script>
"use strict";
const API_BASE_URL="https://glo365.onrender.com/api";
const TOKEN_KEY="glo365_token"; // Temporary authentication token only; result/profile data is fetched from server.
let results=[];
let selectedResult=null;
let loadError="";

function getToken(){try{return sessionStorage.getItem(TOKEN_KEY)||"";}catch(e){return "";}}
async function apiRequest(path,options={}){
 const headers={...(options.headers||{})};
 const token=getToken();
 if(token)headers.Authorization="Bearer "+token;
 if(options.body&&!headers["Content-Type"])headers["Content-Type"]="application/json";
 const response=await fetch(API_BASE_URL+path,{...options,headers,credentials:"include",cache:"no-store"});
 let data={};
 try{data=await response.json();}catch(e){throw new Error("Server returned an invalid response.");}
 if(!response.ok)throw new Error(data.message||data.error||("Request failed ("+response.status+")"));
 return data;
}
function formatDate(date){
 if(!date)return "Unknown Date";
 const value=String(date).slice(0,10);
 const d=new Date(value+"T00:00:00");
 if(Number.isNaN(d.getTime()))return value;
 return d.toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"});
}
function normalizeResult(row){
 const front=Array.isArray(row.frontThree)?row.frontThree:(Array.isArray(row.front_three)?row.front_three:[]);
 return {id:row.id,date:row.date||row.drawDate||row.draw_date,firstPrize:String(row.firstPrize??row.first_prize??""),lastTwo:String(row.lastTwo??row.last_two??""),frontThree:front.map(v=>String(v)),publishedAt:row.publishedAt||row.published_at||null};
}
async function loadResults(){
 const info=document.getElementById("resultInfo");
 info.textContent="Loading results from server...";
 try{
  const data=await apiRequest("/results");
  if(data.success===false)throw new Error(data.message||"Could not load results.");
  const rows=Array.isArray(data)?data:(Array.isArray(data.results)?data.results:(Array.isArray(data.data)?data.data:[]));
  results=rows.map(normalizeResult).filter(r=>r.date&&r.firstPrize&&r.lastTwo&&r.frontThree.length>=2).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  loadError="";
  const search=document.getElementById("searchInput").value.trim();
  if(!search)renderLatest();else searchResults(search);
 }catch(error){
  loadError=error.message||"Unable to connect to the results server.";
  results=[];selectedResult=null;showEmptyResult("Unable to load results.\n"+loadError);
  renderStatistics();
 }
}
function showResult(result){
 if(!result)return;
 selectedResult=result;
 document.getElementById("drawDate").textContent="Draw Date: "+formatDate(result.date);
 document.getElementById("firstPrize").textContent=result.firstPrize||"XXXXXX";
 document.getElementById("lastTwo").textContent=result.lastTwo||"XX";
 document.getElementById("frontThree1").textContent=result.frontThree[0]||"XXX";
 document.getElementById("frontThree2").textContent=result.frontThree[1]||"XXX";
 document.getElementById("resultInfo").textContent=result.publishedAt?"Result Published · "+new Date(result.publishedAt).toLocaleString():"Result Published";
 renderStatistics();
}
function showEmptyResult(message){
 document.getElementById("drawDate").textContent=loadError?"Server Connection Error":"Draw Date: Not Published";
 document.getElementById("firstPrize").textContent="XXXXXX";document.getElementById("lastTwo").textContent="XX";
 document.getElementById("frontThree1").textContent="XXX";document.getElementById("frontThree2").textContent="XXX";
 document.getElementById("resultInfo").textContent=message;
}
function renderLatest(){if(results.length===0){selectedResult=null;showEmptyResult("No results published yet.");renderStatistics();return;}showResult(results[0]);}
function openHistory(){
 const modal=document.getElementById("historyModal"),list=document.getElementById("dateList");list.replaceChildren();
 if(results.length===0){const empty=document.createElement("div");empty.className="empty";empty.textContent=loadError?"Could not load previous results.":"No previous results available.";list.appendChild(empty);}
 else results.forEach(result=>{const button=document.createElement("button");button.className="date-item";if(selectedResult&&selectedResult.date===result.date)button.classList.add("selected");const date=document.createElement("span");date.textContent="Draw Date: "+formatDate(result.date);const radio=document.createElement("span");radio.className="radio";button.append(date,radio);button.addEventListener("click",()=>{showResult(result);closeHistory();});list.appendChild(button);});
 modal.classList.add("show");
}
function closeHistory(){document.getElementById("historyModal").classList.remove("show");}
document.getElementById("historyModal").addEventListener("click",function(event){if(event.target===this)closeHistory();});
function searchResults(raw){
 const query=raw.trim().toLowerCase();if(!query){renderLatest();return;}
 const found=results.filter(result=>[result.date,result.firstPrize,result.lastTwo,...result.frontThree].join(" ").toLowerCase().includes(query));
 if(found.length)showResult(found[0]);else{selectedResult=null;showEmptyResult("No matching draw found.");renderStatistics();}
}
document.getElementById("searchInput").addEventListener("input",function(){searchResults(this.value);});
function switchTab(tab){
 const resultContent=document.getElementById("resultsContent"),statsContent=document.getElementById("statisticsContent"),resultTab=document.getElementById("resultTab"),statsTab=document.getElementById("statsTab");
 if(tab==="results"){resultContent.style.display="block";statsContent.style.display="none";resultTab.classList.add("active");statsTab.classList.remove("active");}
 else{resultContent.style.display="none";statsContent.style.display="block";resultTab.classList.remove("active");statsTab.classList.add("active");renderStatistics();}
}
function renderStatistics(){
 const text=document.getElementById("statisticsText");document.getElementById("drawCount").textContent=results.length+" published draw records";
 if(!selectedResult){text.textContent=loadError?"Statistics unavailable while the server is unreachable.":"No result available.";return;}
 text.textContent="Draw Date: "+formatDate(selectedResult.date)+"\n1st Prize: "+(selectedResult.firstPrize||"XXXXXX")+"\nLast 2: "+(selectedResult.lastTwo||"XX")+"\nFront 3: "+(selectedResult.frontThree[0]||"XXX")+" / "+(selectedResult.frontThree[1]||"XXX");
}
async function updateResultsProfileAvatar(){
 const element=document.getElementById("navProfileAvatar");if(!element)return;
 const token=getToken();if(!token){element.textContent="♙";return;}
 try{
  const data=await apiRequest("/auth/me");
  const user=data.user||data.profile||data;
  const photo=user.avatar||user.photo||user.profile_photo||user.profilePhoto||"";
  if(typeof photo==="string"&&photo.trim()){
   const img=document.createElement("img");img.src=photo;img.alt="My Profile Avatar";img.onerror=()=>{element.textContent="♙";};element.replaceChildren(img);
  }else element.textContent="♙";
 }catch(e){element.textContent="♙";}
}
window.addEventListener("focus",()=>{loadResults();updateResultsProfileAvatar();});
window.addEventListener("pageshow",()=>{loadResults();updateResultsProfileAvatar();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadResults();});
loadResults();updateResultsProfileAvatar();
</script>
</body>
</html>
