
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0878df">
<title>GLO 365 Results</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --blue:#0878df;
  --dark:#102b49;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#e2f3ff,transparent 35%),
    linear-gradient(145deg,#f7faff,#eaf3ff);
  color:var(--dark);
  min-height:100vh;
  overflow-x:hidden;
}

/* HEADER */
.header{
  position:relative;
  overflow:hidden;
  padding:20px 17px 25px;
  color:white;
  background:linear-gradient(130deg,#0759c4,#087fe5,#42b8ff);
  border-radius:0 0 28px 28px;
  box-shadow:0 12px 28px rgba(0,105,220,.25);
  transform-style:preserve-3d;
}

.header:before,
.header:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  pointer-events:none;
}

.header:before{
  width:230px;
  height:230px;
  right:-80px;
  top:-130px;
}

.header:after{
  width:150px;
  height:150px;
  right:100px;
  bottom:-120px;
}

.topbar{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:13px;
}

.back{
  width:46px;
  height:46px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.17);
  backdrop-filter:blur(10px);
  border-radius:15px;
  color:white;
  font-size:29px;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(0,0,0,.12);
}

.brand{
  font-size:25px;
  font-weight:1000;
  letter-spacing:1px;
  text-shadow:0 3px 0 rgba(0,35,100,.25),
              0 6px 15px rgba(0,0,0,.2);
}

.subtitle{
  font-size:11px;
  opacity:.9;
  margin-top:4px;
  letter-spacing:1.2px;
}

/* MAIN */
.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:27px 17px 35px;
}

/* COUNTRY STACK */
.country-stack{
  display:flex;
  flex-direction:column;
  gap:23px;
  perspective:1100px;
}

/* CARD */
.country-card{
  --c1:#b51e3b;
  --c2:#ed4965;
  --c3:#ff8b87;

  position:relative;
  isolation:isolate;
  width:100%;
  min-height:155px;
  padding:20px 17px;
  border-radius:24px;
  display:flex;
  align-items:center;
  gap:15px;
  overflow:hidden;
  color:white;
  text-decoration:none;
  background:linear-gradient(125deg,var(--c1),var(--c2),var(--c3));
  background-size:200% 200%;
  box-shadow:
    0 12px 22px rgba(0,55,120,.18),
    inset 0 2px 2px rgba(255,255,255,.38),
    inset 0 -5px 12px rgba(0,0,0,.12);
  border:1px solid rgba(255,255,255,.55);
  transform-style:preserve-3d;
  animation:
    cardFloat 4s ease-in-out infinite,
    colorFlow 7s ease-in-out infinite;
  transition:transform .3s,filter .3s;
  will-change:transform,background;
}

.country-card:nth-child(2){
  animation-delay:-1.3s,-2s;
}

.country-card:nth-child(3){
  animation-delay:-2.5s,-4s;
}

.country-card:before{
  content:"";
  position:absolute;
  z-index:-1;
  width:190px;
  height:190px;
  right:-55px;
  top:-100px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  box-shadow:0 0 35px rgba(255,255,255,.08);
}

.country-card:after{
  content:"";
  position:absolute;
  z-index:-1;
  width:145px;
  height:145px;
  right:65px;
  bottom:-115px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
}

.country-card:active{
  transform:scale(.96) rotateX(5deg);
  filter:brightness(1.15);
}

/* COUNTRY COLOR ANIMATION */
.thai{
  --c1:#a50d3c;
  --c2:#ed345a;
  --c3:#ff8b77;
}

.malaysia{
  --c1:#064da8;
  --c2:#087fe0;
  --c3:#36c4f4;
}

.singapore{
  --c1:#006e67;
  --c2:#08a78e;
  --c3:#61dfb2;
}

.flag{
  position:relative;
  width:76px;
  height:76px;
  flex-shrink:0;
  border-radius:22px;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  box-shadow:
    0 8px 17px rgba(0,0,0,.14),
    inset 0 1px 3px rgba(255,255,255,.35);
  transform:translateZ(25px);
}

.card-info{
  flex:1;
  min-width:0;
  transform:translateZ(30px);
}

.card-tag{
  display:inline-block;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.28);
  border-radius:20px;
  padding:5px 11px;
  margin-bottom:9px;
}

.card-info h3{
  font-size:18px;
  font-weight:1000;
  line-height:1.2;
  text-shadow:0 2px 5px rgba(0,0,0,.15);
}

.card-info p{
  font-size:11px;
  color:rgba(255,255,255,.9);
  margin-top:6px;
}

.open-label{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:9px 13px;
  border-radius:11px;
  background:linear-gradient(180deg,#fff,#eaf4ff);
  color:#164b7c;
  font-size:10px;
  font-weight:1000;
  box-shadow:
    0 5px 10px rgba(0,0,0,.13),
    inset 0 1px 2px white;
}

.arrow{
  width:35px;
  height:35px;
  flex-shrink:0;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.38);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  color:white;
  transform:translateZ(35px);
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

/* 3D FLOAT */
@keyframes cardFloat{
  0%,100%{
    transform:translateY(0) rotateX(0deg) rotateY(0deg);
  }
  25%{
    transform:translateY(-5px) rotateX(1.5deg) rotateY(-1deg);
  }
  50%{
    transform:translateY(-2px) rotateX(-1deg) rotateY(1deg);
  }
  75%{
    transform:translateY(-6px) rotateX(1deg) rotateY(0deg);
  }
}

/* COLOR FLOW */
@keyframes colorFlow{
  0%,100%{
    background-position:0% 50%;
    filter:saturate(1);
  }
  50%{
    background-position:100% 50%;
    filter:saturate(1.35) brightness(1.08);
  }
}

/* FOOTER */
.footer{
  text-align:center;
  padding:24px 10px;
  color:#8ea1b7;
  font-size:10px;
  letter-spacing:.5px;
}

@media(min-width:600px){
  .container{
    padding-top:35px;
  }

  .country-card{
    min-height:175px;
    padding:24px;
  }

  .flag{
    width:88px;
    height:88px;
    font-size:49px;
  }

  .card-info h3{
    font-size:21px;
  }
}

@media(max-width:360px){
  .country-card{
    min-height:140px;
    padding:14px;
    gap:11px;
  }

  .flag{
    width:62px;
    height:62px;
    font-size:35px;
    border-radius:18px;
  }

  .card-info h3{
    font-size:15px;
  }
}

@media(prefers-reduced-motion:reduce){
  .country-card{
    animation:none;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="topbar">
    <button class="back" onclick="goHome()" aria-label="Go back">‹</button>
    <div>
      <div class="brand">GLO 365</div>
      <div class="subtitle">YOUR RESULTS DESTINATION</div>
    </div>
  </div>

</header>

<main class="container">

  <section class="country-stack">

    <!-- THAILAND -->
    <a class="country-card thai" href="results/thai.html">

      <div class="flag">🇹🇭</div>

      <div class="card-info">
        <span class="card-tag">THAILAND</span>
        <h3>Thai Government Lotto</h3>
        <p>Thailand Lottery Results</p>
        <span class="open-label">VIEW RESULTS ↗</span>
      </div>

      <div class="arrow">›</div>

    </a>

    <!-- MALAYSIA -->
    <a class="country-card malaysia" href="results/malaysia.html">

      <div class="flag">🇲🇾</div>

      <div class="card-info">
        <span class="card-tag">MALAYSIA</span>
        <h3>Malaysia Toto</h3>
        <p>Malaysia Lottery Results</p>
        <span class="open-label">VIEW RESULTS ↗</span>
      </div>

      <div class="arrow">›</div>

    </a>

    <!-- SINGAPORE -->
    <a class="country-card singapore" href="results/Singapore.html">

      <div class="flag">🇸🇬</div>

      <div class="card-info">
        <span class="card-tag">SINGAPORE</span>
        <h3>Singapore Pools</h3>
        <p>Singapore Lottery Results</p>
        <span class="open-label">VIEW RESULTS ↗</span>
      </div>

      <div class="arrow">›</div>

    </a>

  </section>

</main>

<footer class="footer">
  © 2026 GLO 365
</footer>

<script>
"use strict";

function goHome(){
  window.location.href="home.html";
}
</script>

</body>
</html>
