
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2196e8">
<title>Official Thailand Lottery Results - GLO 365</title>

<style>
*{box-sizing:border-box}
:root{
 --blue:#2196e8;
 --dark:#087acb;
 --bg:#f1f7fc;
 --text:#18344b;
 --line:#d8e9f5;
}
html,body{
 margin:0;width:100%;height:100%;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);color:var(--text)
}
.app{
 width:100%;max-width:900px;height:100dvh;
 min-height:100%;margin:auto;background:#fff;
 display:flex;flex-direction:column
}
header{
 flex-shrink:0;
 background:linear-gradient(135deg,var(--blue),var(--dark));
 color:#fff;padding:12px 14px;
 box-shadow:0 3px 12px #087acb30
}
.header-row{display:flex;align-items:center;gap:11px}
.back{
 width:38px;height:38px;flex-shrink:0;
 border:0;border-radius:50%;
 background:#ffffff25;color:#fff;
 font-size:25px;cursor:pointer
}
.heading{flex:1;min-width:0}
.heading h1{font-size:16px;margin:0;font-weight:900}
.heading p{font-size:10px;margin:4px 0 0;color:#e5f5ff}
.flag{font-size:26px}
.notice{
 flex-shrink:0;margin:10px 12px;
 padding:10px 12px;border:1px solid var(--line);
 border-radius:10px;background:#f4faff;
 font-size:11px;line-height:1.5;color:#45647d
}
.frame-wrap{
 position:relative;flex:1;min-height:0;
 background:#fff;border-top:1px solid var(--line)
}
iframe{
 display:block;width:100%;height:100%;
 min-height:300px;border:0;background:#fff
}
.footer{
 flex-shrink:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
 display:flex;gap:9px;align-items:center;justify-content:center;
 border-top:1px solid var(--line);background:#fff
}
.action{
 display:inline-flex;align-items:center;justify-content:center;
 min-height:39px;padding:0 15px;border-radius:9px;
 text-decoration:none;font-size:11px;font-weight:800
}
.home{background:#eaf5fd;color:#087acb;border:1px solid #cfe6f7}
.official{background:linear-gradient(120deg,#087acb,#29a8ed);color:#fff}
@media(min-width:700px){
 .app{height:100vh}
 .notice{font-size:12px}
 .heading h1{font-size:18px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="header-row">
  <button class="back" type="button" id="backButton"
   aria-label="Go back">‹</button>

  <div class="heading">
   <h1>THAILAND GOVERNMENT LOTTERY</h1>
   <p>Official Lottery Website · GLO 365</p>
  </div>

  <div class="flag" aria-hidden="true">🇹🇭</div>
 </div>
</header>

<div class="notice">
 You are viewing the official Thailand Government Lottery website
 inside GLO 365. If the official website does not appear, it may
 restrict embedded viewing. Use “Open Official Website” below.
</div>

<main class="frame-wrap">
 <iframe
  id="officialFrame"
  src="https://www.glo.or.th/home-page"
  title="Official Thailand Government Lottery website"
  loading="eager"
  referrerpolicy="strict-origin-when-cross-origin"
  allow="clipboard-read; clipboard-write">
 </iframe>
</main>

<footer class="footer">
 <a class="action home" href="home.html">← GO TO HOME</a>

 <a class="action official"
  href="https://www.glo.or.th/home-page"
  target="_blank"
  rel="noopener noreferrer">
  OPEN OFFICIAL WEBSITE ↗
 </a>
</footer>

</div>

<script>
"use strict";

document.getElementById("backButton").addEventListener("click",function(){
 if(history.length>1){
  history.back();
 }else{
  location.href="home.html";
 }
});
</script>

</body>
</html>
