<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#168dcc">
<title>GLO 365 - Single</title>

<style>
:root {
  --blue: #168dcc;
  --blue-dark: #0874b5;
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #263445;
  --muted: #718096;
  --border: #e4eaf1;
  --danger: #df5757;
  --green: #168a62;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 14px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
}

.brand {
  font-size: 21px;
  font-weight: 800;
  color: var(--blue-dark);
}

.balance {
  background: #e8f5fc;
  border: 1px solid #cdeafa;
  border-radius: 20px;
  padding: 9px 13px;
  font-size: 13px;
  font-weight: 700;
  color: #0874b5;
}

.heading {
  font-size: 23px;
  font-weight: 800;
  margin: 18px 0 5px;
}

.subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}

.rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bet-row {
  display: grid;
  grid-template-columns: 30px minmax(0, 1.5fr) minmax(0, 0.8fr) minmax(0, 0.8fr) 25px;
  gap: 5px;
  align-items: center;
}

.row-number {
  text-align: center;
  font-size: 13px;
  color: #6b7a8d;
  font-weight: 700;
}

.bet-row input {
  width: 100%;
  min-width: 0;
  height: 47px;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: white;
  padding: 0 8px;
  text-align: center;
  font-size: 15px;
  color: var(--text);
}

.bet-row input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px #168dcc18;
}

.bet-row input::placeholder {
  color: #8793a2;
}

.remove-row {
  border: none;
  background: transparent;
  color: var(--danger);
  font-size: 21px;
  cursor: pointer;
  padding: 0;
}

.add-area {
  display: flex;
  justify-content: flex-end;
  margin: 18px 5px 25px;
}

.add-btn {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 1px solid #dce8f4;
  background: #edf6fc;
  color: var(--blue-dark);
  font-size: 32px;
  font-weight: 700;
  cursor: pointer;
}

.add-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 25px 12px;
  margin-bottom: 13px;
  text-align: center;
  box-shadow: 0 3px 12px #152b3b08;
  font-size: 18px;
  color: #5c6571;
}

.amount {
  color: var(--blue-dark);
  font-weight: 800;
}

.discount-card {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
}

.discount-input {
  width: 75px;
  height: 48px;
  border: 1px solid var(--border);
  border-radius: 12px;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
  background: #f9fbfd;
  color: var(--blue-dark);
}

.discount-input:disabled {
  opacity: 1;
  color: var(--blue-dark);
}

.bet-button {
  width: 100%;
  min-height: 88px;
  margin-top: 35px;
  border: none;
  border-radius: 17px;
  background: linear-gradient(135deg, #35a8d6, #168dcc);
  color: white;
  font-size: 23px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 13px #168dcc30;
}

.bet-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.back-link {
  display: block;
  text-align: center;
  text-decoration: none;
  color: #567b9e;
  font-size: 17px;
  margin: 30px 0;
}

.message {
  display: none;
  padding: 15px;
  margin: 15px 0;
  border-radius: 13px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.message.error {
  display: block;
  background: #fff0ed;
  border: 1px solid #f3d1ca;
  color: #b44d42;
}

.message.success {
  display: block;
  background: #e9f8f0;
  border: 1px solid #c7ebd8;
  color: #168052;
}

.message.info {
  display: block;
  background: #eaf5fc;
  border: 1px solid #cde6f7;
  color: #176b9c;
}

.demo-notice {
  background: #eaf6f0;
  border: 1px solid #d2eade;
  border-radius: 17px;
  padding: 18px 13px;
  text-align: center;
  color: #527765;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 10px;
}

.demo-notice strong {
  display: block;
  margin-bottom: 5px;
}

@media (max-width: 370px) {
  .container {
    padding: 10px;
  }

  .bet-row {
    grid-template-columns: 23px minmax(0, 1.4fr) minmax(0, .7fr) minmax(0, .7fr) 20px;
    gap: 3px;
  }

  .bet-row input {
    height: 43px;
    font-size: 13px;
    padding: 0 3px;
  }

  .summary-card {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <div class="brand">GLO 365</div>
    <div class="balance">
      Balance: <span id="walletBalance">--</span> Points
    </div>
  </div>

  <h1 class="heading">Single</h1>
  <div class="subtitle">Enter your selections below.</div>

  <div id="rows" class="rows"></div>

  <div class="add-area">
    <button type="button" class="add-btn" id="addButton" aria-label="Add row">+</button>
  </div>

  <div class="summary-card">
    Total Amount = <span class="amount" id="totalAmount">0.00</span> Points
  </div>

  <div class="summary-card discount-card">
    <span>Discount</span>
    <input
      class="discount-input"
      id="discount"
      type="number"
      value="0"
      min="0"
      max="100"
      readonly
      aria-label="Discount percentage"
    >
    <span>%</span>
    <span class="amount" id="discountAmount">0.00</span>
    Points
  </div>

  <div class="summary-card">
    Bet Amount = <span class="amount" id="betAmount">0.00</span> Points
  </div>

  <button type="button" class="bet-button" id="placeBetButton">
    PLACE DEMO BET
  </button>

  <a class="back-link" href="index.html">← Back to Home</a>

  <div id="message" class="message"></div>

  <div class="demo-notice">
    <strong>DEMO MODE ONLY</strong>
    Virtual points are used for testing.
    No real-money transactions or cash payouts.
  </div>

</div>

<script>
"use strict";

/* =========================================
   GLO 365 API CONFIGURATION
========================================= */

const API_BASE = "https://glo365.onrender.com/api";

const TOKEN_KEYS = [
  "glo365_access_token",
  "glo365_token",
  "access_token"
];

const MAX_ROWS = 50;
const INITIAL_ROWS = 10;

let currentBalance = 0;
let isSubmitting = false;

/* =========================================
   ELEMENTS
========================================= */

const rowsContainer = document.getElementById("rows");
const addButton = document.getElementById("addButton");
const placeBetButton = document.getElementById("placeBetButton");
const messageBox = document.getElementById("message");

const totalAmountElement = document.getElementById("totalAmount");
const discountAmountElement = document.getElementById("discountAmount");
const betAmountElement = document.getElementById("betAmount");
const walletBalanceElement = document.getElementById("walletBalance");

/* =========================================
   AUTH TOKEN
========================================= */

function getToken() {
  for (const key of TOKEN_KEYS) {
    const value = localStorage.getItem(key);

    if (value && value.trim()) {
      return value.trim();
    }
  }

  try {
    const session = JSON.parse(
      localStorage.getItem("glo365_session") || "null"
    );

    if (session) {
      return (
        session.token ||
        session.access_token ||
        session.accessToken ||
        null
      );
    }
  } catch (error) {
    console.warn("Session parsing error:", error);
  }

  return null;
}

/* =========================================
   API REQUEST
========================================= */

async function apiRequest(path, options = {}) {
  const token = getToken();

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (token) {
    headers.Authorization = "Bearer " + token;
  }

  let response;

  try {
    response = await fetch(API_BASE + path, {
      ...options,
      headers,
      credentials: "include"
    });
  } catch (error) {
    throw new Error(
      "Cannot connect to the server. Please check your internet connection."
    );
  }

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error("The server returned an invalid response.");
  }

  if (!response.ok) {
    throw new Error(
      data.message || ("Server error: " + response.status)
    );
  }

  return data;
}

/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type = "error") {
  messageBox.className = "message " + type;
  messageBox.textContent = text;
}

function hideMessage() {
  messageBox.className = "message";
  messageBox.textContent = "";
}

/* =========================================
   ROW MANAGEMENT
========================================= */

function createRow(number) {
  const row = document.createElement("div");

  row.className = "bet-row";

  row.innerHTML = `
    <span class="row-number">${number}.</span>

    <input
      type="text"
      class="number-input"
      placeholder="Number"
      maxlength="20"
      autocomplete="off"
    >

    <input
      type="number"
      class="d-input"
      placeholder="D"
      min="0"
      step="0.01"
      inputmode="decimal"
    >

    <input
      type="number"
      class="r-input"
      placeholder="R"
      min="0"
      step="0.01"
      inputmode="decimal"
    >

    <button
      type="button"
      class="remove-row"
      aria-label="Remove row"
    >×</button>
  `;

  row.querySelectorAll("input").forEach(input => {
    input.addEventListener("input", calculateTotal);
  });

  row.querySelector(".remove-row").addEventListener("click", () => {
    if (rowsContainer.children.length <= 1) {
      showMessage("At least one row is required.", "info");
      return;
    }

    row.remove();
    renumberRows();
    calculateTotal();
  });

  return row;
}

function addRow() {
  const count = rowsContainer.children.length;

  if (count >= MAX_ROWS) {
    showMessage("Maximum 50 rows are allowed.", "info");
    return;
  }

  rowsContainer.appendChild(createRow(count + 1));

  renumberRows();
  calculateTotal();
  hideMessage();

  addButton.disabled = rowsContainer.children.length >= MAX_ROWS;
}

function renumberRows() {
  [...rowsContainer.children].forEach((row, index) => {
    row.querySelector(".row-number").textContent = (index + 1) + ".";
  });

  addButton.disabled = rowsContainer.children.length >= MAX_ROWS;
}

/* =========================================
   AMOUNT CALCULATION

   D and R are treated as point amounts.
   Total = sum of D + R values.
========================================= */

function getInputAmount(input) {
  const value = Number(input.value);

  if (input.value.trim() === "") return 0;

  if (!Number.isFinite(value) || value < 0) {
    return 0;
  }

  return value;
}

function calculateTotal() {
  let total = 0;

  const rows = [...rowsContainer.querySelectorAll(".bet-row")];

  rows.forEach(row => {
    const d = getInputAmount(row.querySelector(".d-input"));
    const r = getInputAmount(row.querySelector(".r-input"));

    total += d + r;
  });

  // Discount remains zero until the backend provides
  // an authenticated admin-controlled discount setting.
  const discountPercent = 0;
  const discountAmount = total * discountPercent / 100;
  const finalAmount = Math.max(0, total - discountAmount);

  totalAmountElement.textContent = total.toFixed(2);
  discountAmountElement.textContent = discountAmount.toFixed(2);
  betAmountElement.textContent = finalAmount.toFixed(2);

  return {
    total,
    discountAmount,
    finalAmount
  };
}

/* =========================================
   LOAD WALLET
   Correct endpoint: GET /api/wallet
========================================= */

async function loadWallet() {
  const token = getToken();

  if (!token) {
    walletBalanceElement.textContent = "Login required";
    return;
  }

  try {
    const data = await apiRequest("/wallet");

    if (data.success) {
      currentBalance = Number(data.balance || 0);

      walletBalanceElement.textContent =
        currentBalance.toFixed(2);
    } else {
      walletBalanceElement.textContent = "--";
    }

  } catch (error) {
    console.error("Wallet error:", error.message);
    walletBalanceElement.textContent = "--";
  }
}

/* =========================================
   VERIFY LOGIN
   Correct endpoint: GET /api/auth/me
========================================= */

async function verifyLogin() {
  const token = getToken();

  if (!token) {
    showMessage(
      "Please log in first. Your login token was not found.",
      "error"
    );

    placeBetButton.disabled = true;
    return false;
  }

  try {
    await apiRequest("/auth/me");
    placeBetButton.disabled = false;
    return true;

  } catch (error) {
    showMessage(
      "Login verification failed: " + error.message,
      "error"
    );

    placeBetButton.disabled = true;
    return false;
  }
}

/* =========================================
   COLLECT ROW DATA
========================================= */

function collectSelections() {
  const rows = [...rowsContainer.querySelectorAll(".bet-row")];

  const selections = [];

  for (let index = 0; index < rows.length; index++) {
    const row = rows[index];

    const number = row.querySelector(".number-input").value.trim();
    const dInput = row.querySelector(".d-input");
    const rInput = row.querySelector(".r-input");

    const dText = dInput.value.trim();
    const rText = rInput.value.trim();

    const d = getInputAmount(dInput);
    const r = getInputAmount(rInput);

    const hasData = Boolean(number || dText || rText);

    if (!hasData) continue;

    if (!number) {
      throw new Error(
        "Please enter Number in row " + (index + 1) + "."
      );
    }

    if (!dText && !rText) {
      throw new Error(
        "Please enter a D or R amount in row " + (index + 1) + "."
      );
    }

    if (
      (dText && (!Number.isFinite(Number(dText)) || Number(dText) < 0)) ||
      (rText && (!Number.isFinite(Number(rText)) || Number(rText) < 0))
    ) {
      throw new Error(
        "Invalid D or R amount in row " + (index + 1) + "."
      );
    }

    selections.push({
      number,
      d,
      r
    });
  }

  if (!selections.length) {
    throw new Error("Please enter at least one selection.");
  }

  return selections;
}

/* =========================================
   PLACE DEMO BET

   Correct backend route:
   POST /api/demo/bets

   Backend accepts:
   {
     game_name,
     selection,
     amount
   }
========================================= */

async function placeDemoBet() {
  if (isSubmitting) return;

  hideMessage();

  let selections;

  try {
    selections = collectSelections();
  } catch (error) {
    showMessage(error.message, "error");
    return;
  }

  const amounts = calculateTotal();
  const amount = Number(amounts.finalAmount.toFixed(2));

  if (!Number.isFinite(amount) || amount <= 0) {
    showMessage("Bet Amount must be greater than 0.", "error");
    return;
  }

  if (amount > currentBalance) {
    showMessage("Insufficient demo balance.", "error");
    return;
  }

  const token = getToken();

  if (!token) {
    showMessage("Please log in before placing a demo bet.", "error");
    return;
  }

  /*
    The current backend has one selection field
    with a maximum length of 100 characters.

    Therefore each row is submitted as a separate
    demo bet. Total amount is divided proportionally
    by each row's D + R amount.
  */

  const rowAmounts = selections.map(item => item.d + item.r);
  const total = rowAmounts.reduce((sum, value) => sum + value, 0);

  if (total <= 0) {
    showMessage("Enter a valid D or R amount.", "error");
    return;
  }

  const payloads = selections.map((item, index) => {
    const selection = [
      "Number=" + item.number,
      "D=" + item.d,
      "R=" + item.r
    ].join(", ");

    const rowAmount = Number(
      (amount * rowAmounts[index] / total).toFixed(2)
    );

    return {
      game_name: "Single",
      selection,
      amount: rowAmount
    };
  });

  // Correct rounding difference on the final row.
  const allocated = payloads.reduce(
    (sum, item) => sum + item.amount,
    0
  );

  const difference = Number((amount - allocated).toFixed(2));

  payloads[payloads.length - 1].amount = Number(
    (payloads[payloads.length - 1].amount + difference).toFixed(2)
  );

  isSubmitting = true;
  placeBetButton.disabled = true;
  placeBetButton.textContent = "PLEASE WAIT...";

  try {
    /*
      Submit sequentially to avoid duplicate simultaneous
      balance updates. The server checks the draw cutoff
      and balance for every request.
    */

    let completed = 0;

    for (const payload of payloads) {
      await apiRequest("/demo/bets", {
        method: "POST",
        body: JSON.stringify(payload)
      });

      completed++;
    }

    await loadWallet();

    showMessage(
      completed + " demo bet(s) placed successfully. Total: " +
      amount.toFixed(2) + " Points.",
      "success"
    );

    // Clear all rows after successful submission.
    rowsContainer.innerHTML = "";

    for (let i = 1; i <= INITIAL_ROWS; i++) {
      rowsContainer.appendChild(createRow(i));
    }

    renumberRows();
    calculateTotal();

  } catch (error) {
    /*
      Note: If a later row fails, earlier rows may already
      have been accepted by the existing backend.
    */
    await loadWallet();

    showMessage(
      "Bet submission failed: " + error.message,
      "error"
    );

  } finally {
    isSubmitting = false;
    placeBetButton.disabled = false;
    placeBetButton.textContent = "PLACE DEMO BET";
  }
}

/* =========================================
   INITIALIZE PAGE
========================================= */

addButton.addEventListener("click", addRow);

placeBetButton.addEventListener("click", placeDemoBet);

async function initializePage() {
  for (let i = 1; i <= INITIAL_ROWS; i++) {
    rowsContainer.appendChild(createRow(i));
  }

  calculateTotal();

  const loggedIn = await verifyLogin();

  if (loggedIn) {
    await loadWallet();
  }
}

initializePage();

</script>

</body>
</html>
