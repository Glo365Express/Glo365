
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2196e8">
<title>GLO 365 - 2D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f7fd;color:#18334d}
.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding-bottom:25px;box-shadow:0 0 25px #163c5c0b}
.header{background:linear-gradient(120deg,#1687d5,#2196e8);padding:17px 15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;color:#fff}
.logo span{color:#d9f0ff}
.balance{background:#fff;color:#167fc4;padding:10px 14px;border-radius:30px;font-size:13px;font-weight:bold}
.page-title{background:#2196e8;text-align:center;padding:15px 10px;font-size:19px;font-weight:900;color:#fff}
.subtitle{text-align:center;padding:12px 5px;background:#eff8ff;color:#167fc4;font-size:13px;font-weight:bold}
.lock-notice{display:none;margin:12px 11px 4px;padding:14px 12px;background:#fff0f0;border:1px solid #ffcaca;border-radius:11px;text-align:center;color:#b42332}
.lock-notice.show{display:block}
.lock-notice strong{display:block;font-size:14px;font-weight:900;margin-bottom:5px}
.lock-notice span{display:block;font-size:12px;line-height:1.6;overflow-wrap:anywhere}
.lock-countdown{margin-top:7px;font-weight:bold}
.bet-area{padding:8px 9px 0}
.bet-area.locked input{background:#f0f0f0;color:#999;border-color:#ddd;cursor:not-allowed}
.bet-area.locked .remove-btn{opacity:.35;cursor:not-allowed}
.column-heading,.bet-row{display:grid;grid-template-columns:23px minmax(0,1.05fr) minmax(0,.9fr) minmax(0,.9fr) 20px;gap:5px}
.column-heading{padding:8px 0;font-size:10px;font-weight:bold;color:#8195a8;text-align:center}
.bet-row{align-items:center;margin-bottom:8px}
.serial{text-align:center;font-size:14px;color:#526f87}
.bet-row input{width:100%;min-width:0;height:49px;border:1px solid #cbdfee;background:#f7fbff;border-radius:10px;text-align:center;font-size:14px;color:#18334d;outline:none;padding:4px}
.bet-row input:focus{border-color:#2196e8;background:#fff;box-shadow:0 0 0 3px #2196e817}
.bet-row input::placeholder{color:#9aabba}
.remove-btn{border:0;background:transparent;color:#d34c5e;font-size:20px;font-weight:bold;padding:3px 0;cursor:pointer}
.add-area{display:flex;justify-content:flex-end;padding:5px 3px 17px}
.add-btn{width:43px;height:43px;border-radius:50%;background:#eff8ff;color:#1687d5;border:1px solid #cbdfee;font-size:29px;font-weight:bold;display:grid;place-items:center;cursor:pointer}
.add-btn:disabled{opacity:.4;cursor:not-allowed}
.summary{padding:5px 11px}
.summary-box{background:#eff8ff;border:1px solid #dcebf6;border-radius:12px;padding:16px 7px;text-align:center;font-size:14px;margin-bottom:9px;color:#526f87}
.summary-box strong{font-weight:900;color:#167fc4}
.discount-line{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px}
.discount-value{background:#fff;border:1px solid #cbdfee;border-radius:7px;min-width:55px;padding:7px 9px;font-weight:bold;color:#167fc4}
.discount-percent{color:#526f87;font-weight:bold}
.discount-amount{font-weight:bold;color:#1687d5}
.place-btn{width:calc(100% - 22px);margin:17px 11px 0;padding:16px 8px;background:linear-gradient(90deg,#1687d5,#2196e8);border:0;border-radius:10px;color:#fff;font-size:17px;font-weight:900;box-shadow:0 4px 12px #1687d530;cursor:pointer}
.place-btn:active{transform:scale(.98)}
.place-btn:disabled{opacity:.6;cursor:not-allowed;background:#8999a5;box-shadow:none}
.ad-container{width:100%;min-height:58px;margin:10px auto 8px;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#fff}
.ad-container iframe{max-width:100%;border:0}
.back-btn{display:block;margin:10px auto;border:0;background:transparent;color:#167fc4;padding:10px;font-size:13px;cursor:pointer}
.notice{margin:10px 11px;padding:12px;background:#eff8ff;border:1px solid #dcebf6;border-radius:9px;text-align:center;color:#526f87;font-size:11px;line-height:1.7}
.notice strong{color:#167fc4}
@media(max-width:380px){
 .logo{font-size:24px}
 .balance{font-size:11px;padding:9px}
 .bet-row input{height:45px;font-size:12px}
 .column-heading{font-size:9px;gap:3px}
 .bet-row{gap:3px}
 .serial{font-size:12px}
 .summary-box{font-size:13px}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
 <div class="logo">GLO <span>365</span></div>
 <div class="balance"><span id="balance">0.00</span> Points</div>
</header>

<div class="page-title">2D NUMBER</div>
<div class="subtitle">Enter 2 Digit Number & Virtual Points</div>

<div class="lock-notice" id="lockNotice" role="alert">
 <strong id="lockTitle">BETTING CLOSED</strong>
 <span id="lockMessage"></span>
 <span class="lock-countdown" id="lockCountdown"></span>
</div>

<section class="bet-area" id="betArea">
 <div class="column-heading">
  <span>#</span><span>NUMBER</span><span>STRAIGHT (D)</span><span>RUMBLE (R)</span><span></span>
 </div>
 <div id="betRows"></div>
 <div class="add-area">
  <button class="add-btn" id="addRow" type="button" title="Add more rows">+</button>
 </div>
</section>

<section class="summary">
 <div class="summary-box">Total Amount = <strong id="totalAmount">0.00</strong> Points</div>
 <div class="summary-box">
  <div class="discount-line">
   <span>Discount</span>
   <span class="discount-value" id="discountPercent">0</span>
   <span class="discount-percent">%</span>
   <strong class="discount-amount" id="discountAmount">0.00</strong>
   <span>Points</span>
  </div>
 </div>
 <div class="summary-box">Bet Amount = <strong id="betAmount">0.00</strong> Points</div>
</section>

<button class="place-btn" id="placeBet" type="button">PLACE DEMO BET</button>

<!-- ADSTERRA BANNER -->
<div class="ad-container">
 <script>
 var atOptions={
  'key':'ab837cf0ea9c26ae43b7bc4e05a0b5de',
  'format':'iframe',
  'height':50,
  'width':320,
  'params':{}
 };
 </script>
 <script src="https://bicea.org/22/ab837cf0ea9c26ae43b7bc4e05a0b5de"></script>
</div>

<button class="back-btn" onclick="location.href='home.html'">← Back to Home</button>

<div class="notice">
 <strong>DEMO MODE ONLY</strong><br>
 Virtual points are used for testing.<br>
 No real-money transactions or cash payouts.
</div>
</div>

<script>
"use strict";

/* =========================================
   GLO 365 - 2D BACKEND VERSION
   Server/PostgreSQL is the source of truth.
   Only the authentication token is local.
========================================= */

const API_BASE = "https://glo365.onrender.com/api";
const TOKEN_KEY = "glo365_token";

const MIN_ROWS = 10;
const MAX_ROWS = 50;
const LOCK_MINUTES = 45;
const LOCK_TIME = LOCK_MINUTES * 60 * 1000;

let currentUser = null;
let wallet = 0;
let discount = 0;
let isBetLocked = true;
let schedule = null;
let submitting = false;

const rowsContainer = document.getElementById("betRows");
const addButton = document.getElementById("addRow");
const placeButton = document.getElementById("placeBet");

const balanceElement = document.getElementById("balance");
const totalElement = document.getElementById("totalAmount");
const discountElement = document.getElementById("discountAmount");
const discountPercentElement = document.getElementById("discountPercent");
const betAmountElement = document.getElementById("betAmount");

function getToken(){
 return localStorage.getItem(TOKEN_KEY) || "";
}

async function api(path, options = {}){
 const token = getToken();

 const headers = {
  "Accept":"application/json",
  ...(options.body ? {"Content-Type":"application/json"} : {}),
  ...(token ? {"Authorization":"Bearer "+token} : {})
 };

 const response = await fetch(API_BASE + path,{
  method:options.method || "GET",
  headers,
  credentials:"include",
  cache:"no-store",
  body:options.body ? JSON.stringify(options.body) : undefined
 });

 const raw = await response.text();
 let data = {};

 try{
  data = raw ? JSON.parse(raw) : {};
 }catch(error){
  throw new Error("Invalid server response.");
 }

 if(response.status === 401){
  localStorage.removeItem(TOKEN_KEY);
  location.replace("login.html");
  throw new Error("Your login session has expired.");
 }

 if(!response.ok){
  throw new Error(data.message || data.error || "Server error ("+response.status+").");
 }

 if(data.success === false){
  throw new Error(data.message || data.error || "Request failed.");
 }

 return data;
}

function unwrap(data){
 if(!data || typeof data !== "object") return {};
 return data.data && typeof data.data === "object" ? data.data : data;
}

function money(value){
 const n = Number(value);
 return Number.isFinite(n) ? n : 0;
}

/* =========================================
   AUTHENTICATION
========================================= */

async function loadCurrentUser(){
 if(!getToken()){
  location.replace("login.html");
  throw new Error("Login required.");
 }

 const response = await api("/auth/me");
 const data = unwrap(response);

 currentUser = data.user || data.profile || data;

 if(!currentUser || !currentUser.id){
  throw new Error("User information was not returned by the server.");
 }
}

/* =========================================
   WALLET
========================================= */

async function loadWallet(){
 const response = await api("/wallet");
 const data = unwrap(response);

 if(data.currency && data.currency !== "DEMO"){
  throw new Error("Unexpected wallet currency.");
 }

 wallet = money(data.balance);

 if(wallet < 0) wallet = 0;

 balanceElement.textContent = wallet.toFixed(2);
}

/* =========================================
   DRAW SETTINGS
   Admin-managed settings must come from server.
========================================= */

function parseDrawTime(value){
 if(!value || typeof value !== "string") return null;

 const timestamp = Date.parse(value);

 if(!Number.isFinite(timestamp)) return null;

 return timestamp;
}

async function loadDrawSettings(){
 schedule = null;

 try{
  const response = await api("/public/draw-settings");
  const data = unwrap(response);

  const settings =
   data.draw_settings ||
   data.drawSettings ||
   data.settings ||
   data;

  const drawAt =
   settings.draw_at ||
   settings.drawAt ||
   settings.draw_time ||
   settings.drawTime;

  const timestamp = parseDrawTime(drawAt);

  if(timestamp === null) return;

  schedule = {
   timestamp,
   drawNumber:String(
    settings.draw_number ||
    settings.drawNumber ||
    ""
   )
  };
 }catch(error){
  console.warn("Draw settings unavailable:",error.message);
 }
}

function formatDrawTime(timestamp){
 return new Date(timestamp).toLocaleString("en-GB",{
  day:"2-digit",
  month:"short",
  year:"numeric",
  hour:"2-digit",
  minute:"2-digit",
  hour12:true
 });
}

function formatRemaining(milliseconds){
 if(!Number.isFinite(milliseconds) || milliseconds < 0){
  return "00:00:00";
 }

 const seconds = Math.floor(milliseconds/1000);
 const hours = Math.floor(seconds/3600);
 const minutes = Math.floor((seconds%3600)/60);
 const secs = seconds%60;

 return [
  String(hours).padStart(2,"0"),
  String(minutes).padStart(2,"0"),
  String(secs).padStart(2,"0")
 ].join(":");
}

function getLockStatus(){
 if(!schedule){
  return {locked:true,reason:"missing",remaining:null};
 }

 const remaining = schedule.timestamp - Date.now();

 return {
  locked:remaining <= LOCK_TIME,
  reason:remaining <= LOCK_TIME ? "cutoff" : "open",
  remaining
 };
}

function applyBetLock(){
 const status = getLockStatus();
 isBetLocked = status.locked;

 const notice = document.getElementById("lockNotice");
 const title = document.getElementById("lockTitle");
 const message = document.getElementById("lockMessage");
 const countdown = document.getElementById("lockCountdown");
 const area = document.getElementById("betArea");

 if(status.locked){
  notice.classList.add("show");
  area.classList.add("locked");

  if(status.reason === "missing"){
   title.textContent = "BETTING UNAVAILABLE";
   message.textContent =
    "Draw schedule is not available from the server. Please wait for the Admin to configure the next draw.";
   countdown.textContent = "";
  }else{
   title.textContent = "BETTING CLOSED – DRAW TIME APPROACHING";
   message.textContent =
    (schedule.drawNumber ? "Draw Number: "+schedule.drawNumber+". " : "")+
    "Draw Time: "+formatDrawTime(schedule.timestamp);
   countdown.textContent =
    "Draw starts in: "+formatRemaining(Math.max(0,status.remaining));
  }
 }else{
  notice.classList.remove("show");
  area.classList.remove("locked");
  countdown.textContent = "";
 }

 document.querySelectorAll("#betRows input,#betRows button").forEach(control=>{
  control.disabled = isBetLocked || submitting;
 });

 addButton.disabled =
  isBetLocked ||
  submitting ||
  rowsContainer.querySelectorAll(".bet-row").length >= MAX_ROWS;

 placeButton.disabled = isBetLocked || submitting;

 placeButton.textContent = submitting
  ? "PLEASE WAIT..."
  : isBetLocked
   ? "BETTING CLOSED"
   : "PLACE DEMO BET";
}

/* =========================================
   DISCOUNT
========================================= */

/*
  The current backend does not expose a 2D
  discount API in the known server routes.
  Do not read admin discount from LocalStorage.
  Keep discount at 0 until a server API exists.
*/

async function loadDiscount(){
 discount = 0;
 discountPercentElement.textContent = "0";
 calculate();
}

/* =========================================
   ROW CREATION
========================================= */

function createRow(){
 const row = document.createElement("div");
 row.className = "bet-row";

 const serial = document.createElement("span");
 serial.className = "serial";

 const number = document.createElement("input");
 number.type = "text";
 number.inputMode = "numeric";
 number.maxLength = 2;
 number.placeholder = "Number";
 number.dataset.field = "number";

 const straight = document.createElement("input");
 straight.type = "number";
 straight.inputMode = "decimal";
 straight.min = "0";
 straight.step = "0.01";
 straight.placeholder = "D";
 straight.dataset.field = "straight";

 const rumble = document.createElement("input");
 rumble.type = "number";
 rumble.inputMode = "decimal";
 rumble.min = "0";
 rumble.step = "0.01";
 rumble.placeholder = "R";
 rumble.dataset.field = "rumble";

 const remove = document.createElement("button");
 remove.type = "button";
 remove.className = "remove-btn";
 remove.textContent = "×";
 remove.title = "Clear or remove row";

 row.append(serial,number,straight,rumble,remove);
 rowsContainer.appendChild(row);

 [number,straight,rumble].forEach(input=>{
  input.addEventListener("input",()=>{
   if(getLockStatus().locked){
    applyBetLock();
    return;
   }

   if(input === number){
    input.value = input.value.replace(/\D/g,"").slice(0,2);
   }

   calculate();
  });
 });

 remove.addEventListener("click",()=>{
  if(getLockStatus().locked || submitting){
   applyBetLock();
   return;
  }

  const count = rowsContainer.querySelectorAll(".bet-row").length;

  if(count > MIN_ROWS){
   row.remove();
  }else{
   number.value = "";
   straight.value = "";
   rumble.value = "";
  }

  updateSerials();
  calculate();
 });

 updateSerials();
 applyBetLock();
}

function addRow(){
 if(getLockStatus().locked || submitting){
  applyBetLock();
  return;
 }

 const count = rowsContainer.querySelectorAll(".bet-row").length;

 if(count >= MAX_ROWS){
  alert("Maximum 50 rows allowed.");
  return;
 }

 createRow();
}

function updateSerials(){
 const rows = rowsContainer.querySelectorAll(".bet-row");

 rows.forEach((row,index)=>{
  row.querySelector(".serial").textContent = (index+1)+".";
 });

 updateAddButton();
}

function updateAddButton(){
 const count = rowsContainer.querySelectorAll(".bet-row").length;

 addButton.disabled = isBetLocked || submitting || count >= MAX_ROWS;
 addButton.title = count >= MAX_ROWS
  ? "Maximum 50 rows reached"
  : "Add row ("+count+"/"+MAX_ROWS+")";
}

addButton.addEventListener("click",addRow);

/* =========================================
   CALCULATION AND VALIDATION
========================================= */

function getRows(){
 const result = [];

 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{
  const number = row.querySelector('[data-field="number"]').value.trim();
  const dValue = row.querySelector('[data-field="straight"]').value;
  const rValue = row.querySelector('[data-field="rumble"]').value;

  if(number === "" && dValue === "" && rValue === "") return;

  result.push({
   number,
   straight:dValue === "" ? 0 : Number(dValue),
   rumble:rValue === "" ? 0 : Number(rValue)
  });
 });

 return result;
}

function calculate(){
 let total = 0;

 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{
  const d = row.querySelector('[data-field="straight"]').value;
  const r = row.querySelector('[data-field="rumble"]').value;

  const straight = d === "" ? 0 : Number(d);
  const rumble = r === "" ? 0 : Number(r);

  if(Number.isFinite(straight) && straight > 0) total += straight;
  if(Number.isFinite(rumble) && rumble > 0) total += rumble;
 });

 const discountAmount = total * discount / 100;
 const finalAmount = total - discountAmount;

 totalElement.textContent = total.toFixed(2);
 discountElement.textContent = discountAmount.toFixed(2);
 betAmountElement.textContent = finalAmount.toFixed(2);

 return {total,discount,discountAmount,finalAmount};
}

function validateRows(rows){
 if(rows.length === 0){
  alert("Please enter at least one number and D or R points.");
  return false;
 }

 for(const row of rows){
  if(!/^\d{2}$/.test(row.number)){
   alert("Each 2D number must contain exactly two digits (00-99).");
   return false;
  }

  if(
   !Number.isFinite(row.straight) ||
   !Number.isFinite(row.rumble) ||
   row.straight < 0 ||
   row.rumble < 0
  ){
   alert("Please enter valid non-negative amounts.");
   return false;
  }

  if(row.straight === 0 && row.rumble === 0){
   alert("Enter points in either D or R.");
   return false;
  }

  if(row.straight > 100000 || row.rumble > 100000){
   alert("Amount is too large.");
   return false;
  }
 }

 return true;
}

/* =========================================
   SUBMIT BET TO BACKEND
========================================= */

/*
  Existing backend contract:
  POST /api/demo/bets
  {
    game_name: string,
    selection: string (max 100 characters),
    amount: number
  }

  The server validates and deducts wallet balance
  inside a database transaction.
*/

function makeSelection(rows){
 return rows.map(row=>{
  let item = row.number;

  if(row.straight > 0) item += "D"+row.straight;
  if(row.rumble > 0) item += "R"+row.rumble;

  return item;
 }).join(",");
}

async function submitBet(){
 if(submitting) return;

 if(getLockStatus().locked){
  applyBetLock();
  alert("Betting is closed. Please check the next draw schedule.");
  return;
 }

 const rows = getRows();

 if(!validateRows(rows)) return;

 const amounts = calculate();

 if(amounts.total <= 0 || amounts.finalAmount <= 0){
  alert("Please enter a valid bet amount.");
  return;
 }

 if(amounts.discount > 0){
  alert("Discount is not currently configured on the server. Please refresh the page.");
  return;
 }

 const selection = makeSelection(rows);

 /*
  * Existing server accepts selection with a maximum
  * length of 100 characters. Reject longer entries
  * instead of silently truncating the user's numbers.
  */
 if(selection.length > 100){
  alert("These selections are too long for the current server API. Please submit fewer rows at a time.");
  return;
 }

 if(!confirm(
  "Confirm your 2D demo bet?\n\n"+
  "Numbers: "+rows.length+
  "\nTotal Points: "+amounts.finalAmount.toFixed(2)+
  "\n\nThe server will deduct points from your demo wallet."
 )) return;

 submitting = true;
 applyBetLock();

 try{
  // Recheck draw lock immediately before submitting.
  if(getLockStatus().locked){
   throw new Error("Betting has closed because the draw time is approaching.");
  }

  // Refresh server wallet before submission.
  await loadWallet();

  if(amounts.finalAmount > wallet){
   throw new Error("Insufficient demo points. Your current balance is "+wallet.toFixed(2)+".");
  }

  // Final schedule check.
  if(getLockStatus().locked){
   throw new Error("Betting has closed. Please try the next draw.");
  }

  const response = await api("/demo/bets",{
   method:"POST",
   body:{
    game_name:"2D",
    selection:selection,
    amount:amounts.finalAmount
   }
  });

  /*
   * The backend is responsible for wallet deduction.
   * Never deduct points again in browser code.
   */
  await loadWallet();

  alert(
   "2D demo bet submitted successfully!\n\n"+
   "Numbers: "+rows.length+
   "\nBet Amount: "+amounts.finalAmount.toFixed(2)+
   "\nRemaining Points: "+wallet.toFixed(2)
  );

  resetRows();

 }catch(error){
  alert("Bet could not be submitted:\n"+error.message);

  try{
   await loadWallet();
  }catch(walletError){
   console.warn(walletError);
  }

 }finally{
  submitting = false;
  applyBetLock();
 }
}

placeButton.addEventListener("click",submitBet);

/* =========================================
   RESET ROWS
========================================= */

function resetRows(){
 rowsContainer.replaceChildren();

 for(let i=0;i<MIN_ROWS;i++){
  createRow();
 }

 updateSerials();
 calculate();
 applyBetLock();
}

/* =========================================
   REFRESH AND INITIALIZE
========================================= */

async function refreshPageData(){
 await Promise.allSettled([
  loadWallet(),
  loadDrawSettings(),
  loadDiscount()
 ]);

 applyBetLock();
}

let lockTimer = null;

async function initialize(){
 placeButton.disabled = true;
 placeButton.textContent = "LOADING...";

 try{
  await loadCurrentUser();
  await refreshPageData();

  if(!lockTimer){
   lockTimer = setInterval(applyBetLock,1000);
  }

  placeButton.textContent = isBetLocked
   ? "BETTING CLOSED"
   : "PLACE DEMO BET";

 }catch(error){
  console.error(error);
  alert("Unable to load 2D page: "+error.message);

  if(!getToken()){
   location.replace("login.html");
  }
 }
}

window.addEventListener("focus",()=>{
 if(!submitting) refreshPageData();
});

window.addEventListener("pageshow",()=>{
 if(!submitting) refreshPageData();
});

resetRows();
initialize();

</script>
