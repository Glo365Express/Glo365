<script>
"use strict";

/* =========================================
   GLO 365 - 3 UP
   Backend: Node.js + Express
   Database: PostgreSQL
   No LocalStorage
========================================= */

const API_BASE_URL="https://glo365.onrender.com/api";
const TOKEN_KEY="glo365_token";

const MIN_ROWS=10;
const MAX_ROWS=50;
const MAX_BET_AMOUNT=100000;
const FALLBACK_LOCK_MINUTES=45;

const rowsContainer=document.getElementById("betRows");
const addButton=document.getElementById("addRow");
const placeButton=document.getElementById("placeBet");

const totalElement=document.getElementById("totalAmount");
const discountElement=document.getElementById("discountAmount");
const discountPercentElement=document.getElementById("discountPercent");
const betAmountElement=document.getElementById("betAmount");
const balanceElement=document.getElementById("balance");

const lockStatus=document.getElementById("lockStatus");
const lockTitle=document.getElementById("lockTitle");
const lockMessage=document.getElementById("lockMessage");
const pageMessage=document.getElementById("pageMessage");

let wallet=0;
let discount=0;

let bettingLocked=true;
let serverBettingLocked=true;
let authenticated=false;
let submitting=false;
let serverSettingsLoaded=false;

let drawTimestamp=null;
let drawNumber="";
let lockMinutes=FALLBACK_LOCK_MINUTES;

let currentUser=null;
let messageTimer=null;
let countdownTimer=null;
let refreshBusy=false;

/* =========================================
   SESSION
========================================= */

function getBearerToken(){
 try{
  return sessionStorage.getItem(TOKEN_KEY)||"";
 }catch(error){
  return "";
 }
}

function clearSession(){
 try{
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem("glo365_user");
  sessionStorage.removeItem("glo365_session");
 }catch(error){}
}

function redirectToLogin(){
 clearSession();
 location.replace(
  "login.html?next="+encodeURIComponent("3up.html")
 );
}

/* =========================================
   MESSAGE
========================================= */

function showMessage(message,type="info"){
 clearTimeout(messageTimer);

 pageMessage.textContent=String(message||"");
 pageMessage.className="message show "+type;

 messageTimer=setTimeout(()=>{
  clearMessage();
 },10000);
}

function clearMessage(){
 clearTimeout(messageTimer);
 pageMessage.textContent="";
 pageMessage.className="message";
}

/* =========================================
   API REQUEST
========================================= */

async function apiRequest(path,options={}){

 const headers=new Headers(options.headers||{});
 const token=getBearerToken();

 headers.set("Accept","application/json");

 if(token){
  headers.set("Authorization","Bearer "+token);
 }

 let body=options.body;

 if(body!==undefined&&body!==null){
  if(typeof body!=="string"){
   body=JSON.stringify(body);
  }
  headers.set("Content-Type","application/json");
 }

 let response;

 try{
  response=await fetch(API_BASE_URL+path,{
   method:options.method||"GET",
   headers,
   credentials:"include",
   cache:"no-store",
   body
  });
 }catch(error){
  throw new Error(
   "Cannot connect to GLO 365 server. Check your internet connection."
  );
 }

 const raw=await response.text();
 let data={};

 if(raw){
  try{
   data=JSON.parse(raw);
  }catch(error){
   throw new Error("The server returned an invalid response.");
  }
 }

 if(response.status===401){
  authenticated=false;

  const error=new Error("Login session expired.");
  error.status=401;
  throw error;
 }

 if(!response.ok||data.success===false){
  const error=new Error(
   data.message||
   data.error||
   "Request failed ("+response.status+")."
  );

  error.status=response.status;
  throw error;
 }

 return data;
}

/* =========================================
   RESPONSE HELPERS
========================================= */

function unwrap(data){
 if(!data||typeof data!=="object")return {};

 let result=data;

 for(let i=0;i<3;i++){
  if(
   result.data&&
   typeof result.data==="object"&&
   !Array.isArray(result.data)
  ){
   result=result.data;
  }else{
   break;
  }
 }

 return result;
}

function getNumber(value){
 const number=Number(value);
 return Number.isFinite(number)?number:null;
}

/* =========================================
   WALLET
========================================= */

function formatPoints(value){
 const number=Number(value);

 return Number.isFinite(number)
  ?number.toFixed(2)
  :"0.00";
}

function setWallet(value){

 const amount=Number(value);

 if(!Number.isFinite(amount)||amount<0){
  throw new Error("Invalid wallet balance returned by server.");
 }

 wallet=amount;
 balanceElement.textContent=formatPoints(wallet);
}

async function loadWallet(){

 const response=await apiRequest("/wallet");
 const data=unwrap(response);

 const walletData=
  data.wallet&&typeof data.wallet==="object"
   ?data.wallet
   :data;

 const balance=
  walletData.balance??
  walletData.wallet_balance??
  walletData.demo_balance;

 if(balance===undefined){
  throw new Error("The server did not return wallet balance.");
 }

 if(
  walletData.currency&&
  walletData.currency!=="DEMO"
 ){
  throw new Error("Unexpected wallet currency.");
 }

 setWallet(balance);
}

/* =========================================
   AUTHENTICATION
========================================= */

async function loadCurrentUser(){

 const response=await apiRequest("/auth/me");
 const data=unwrap(response);

 currentUser=
  data.user||
  data.profile||
  data;

 if(
  !currentUser||
  typeof currentUser!=="object"||
  currentUser.id===undefined
 ){
  throw new Error(
   "The server did not return valid logged-in user information."
  );
 }

 if(
  currentUser.status&&
  String(currentUser.status).toLowerCase()!=="active"
 ){
  throw new Error(
   "Your account is not active. Please contact the administrator."
  );
 }

 authenticated=true;

}

/* =========================================
   DRAW SETTINGS
========================================= */

function parseDrawTime(value){

 if(!value)return null;

 const timestamp=Date.parse(value);

 return Number.isFinite(timestamp)
  ?timestamp
  :null;
}

function updateDrawStatus(settings){

 const draw=
  settings.drawSettings||
  settings.draw_settings||
  settings.draw||
  settings.schedule||
  null;

 lockMinutes=
  Number(settings.lock_minutes)>0
   ?Number(settings.lock_minutes)
   :FALLBACK_LOCK_MINUTES;

 serverBettingLocked=
  settings.betting_locked===true||
  settings.bettingLocked===true;

 if(!draw||typeof draw!=="object"){
  drawTimestamp=null;
  drawNumber="";
  setBettingStatus(
   true,
   "BETTING UNAVAILABLE",
   "The administrator has not configured a valid draw schedule."
  );
  return;
 }

 drawTimestamp=parseDrawTime(
  draw.draw_at||
  draw.drawAt||
  draw.draw_time||
  draw.drawTime
 );

 drawNumber=String(
  draw.draw_number||
  draw.drawNumber||
  ""
 );

 if(drawTimestamp===null){
  setBettingStatus(
   true,
   "BETTING UNAVAILABLE",
   "The server returned an invalid draw date and time."
  );
  return;
 }

 updateBettingStatus();
}

async function loadSettings(){

 const response=await apiRequest(
  "/public/3up-settings"
 );

 const settings=unwrap(response);

 if(settings.is_demo===false){
  throw new Error(
   "This endpoint is not configured for demo mode."
  );
 }

 const discountValue=getNumber(
  settings.discount_percent??
  settings.discountPercent??
  settings.discount
 );

 discount=discountValue===null
  ?0
  :Math.min(100,Math.max(0,discountValue));

 discountPercentElement.textContent=
  discount.toFixed(2).replace(/\.00$/,"");

 serverSettingsLoaded=true;

 updateDrawStatus(settings);
 calculate();
}

/* =========================================
   BETTING STATUS
========================================= */

function formatDrawTime(timestamp){

 return new Date(timestamp).toLocaleString("en-GB",{
  day:"2-digit",
  month:"short",
  year:"numeric",
  hour:"2-digit",
  minute:"2-digit",
  hour12:true
 });
}

function formatRemaining(milliseconds){

 if(!Number.isFinite(milliseconds)||milliseconds<=0){
  return "00:00:00";
 }

 const seconds=Math.floor(milliseconds/1000);
 const hours=Math.floor(seconds/3600);
 const minutes=Math.floor((seconds%3600)/60);
 const secs=seconds%60;

 return [
  String(hours).padStart(2,"0"),
  String(minutes).padStart(2,"0"),
  String(secs).padStart(2,"0")
 ].join(":");
}

function updateBettingStatus(){

 if(!serverSettingsLoaded||!drawTimestamp){
  setBettingStatus(
   true,
   "BETTING UNAVAILABLE",
   "Waiting for a valid server draw schedule."
  );
  return;
 }

 const remaining=drawTimestamp-Date.now();
 const cutoff=lockMinutes*60*1000;

 if(serverBettingLocked||remaining<=cutoff){

  setBettingStatus(
   true,
   "BETTING CLOSED",
   (drawNumber?"Draw Number: "+drawNumber+". ":"")+
   "Draw Time: "+formatDrawTime(drawTimestamp)+
   (remaining<=0
    ?". The scheduled draw time has passed."
    :". Betting closes "+lockMinutes+" minutes before the draw.")
  );

  return;
 }

 const hours=Math.floor(remaining/3600000);
 const minutes=Math.floor((remaining%3600000)/60000);
 const seconds=Math.floor((remaining%60000)/1000);

 setBettingStatus(
  false,
  "BETTING IS OPEN",
  "Draw: "+formatDrawTime(drawTimestamp)+
  " | Time remaining: "+
  String(hours).padStart(2,"0")+":"+
  String(minutes).padStart(2,"0")+":"+
  String(seconds).padStart(2,"0")
 );
}

function setBettingStatus(locked,title,message){

 bettingLocked=!!locked;

 lockStatus.className=
  bettingLocked
   ?"lock-status locked"
   :"lock-status open";

 lockTitle.textContent=title;
 lockMessage.textContent=message;

 applyBettingLock();
}

/* =========================================
   CONTROLS
========================================= */

function applyBettingLock(){

 const disabled=
  bettingLocked||
  submitting||
  !authenticated||
  !serverSettingsLoaded;

 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{

  row.querySelectorAll("input").forEach(input=>{
   input.disabled=disabled;
  });

  const remove=row.querySelector(".remove-btn");

  if(remove){
   remove.disabled=disabled;
  }
 });

 const count=
  rowsContainer.querySelectorAll(".bet-row").length;

 addButton.disabled=
  disabled||
  count>=MAX_ROWS;

 placeButton.disabled=disabled;

 placeButton.textContent=
  submitting
   ?"SUBMITTING…"
   :!authenticated
    ?"LOGIN REQUIRED"
    :!serverSettingsLoaded
     ?"LOADING…"
     :bettingLocked
      ?"BETTING CLOSED"
      :"PLACE BET";
}

/* =========================================
   ROW MANAGEMENT
========================================= */

function updateSerials(){

 rowsContainer.querySelectorAll(".bet-row").forEach((row,index)=>{
  row.querySelector(".serial").textContent=(index+1)+".";
 });

 applyBettingLock();
}

function createRow(){

 if(rowsContainer.querySelectorAll(".bet-row").length>=MAX_ROWS){
  return;
 }

 const row=document.createElement("div");
 row.className="bet-row";

 const serial=document.createElement("span");
 serial.className="serial";

 const number=document.createElement("input");
 number.type="text";
 number.inputMode="numeric";
 number.maxLength=3;
 number.placeholder="Number";
 number.autocomplete="off";
 number.dataset.field="number";

 const straight=document.createElement("input");
 straight.type="number";
 straight.inputMode="decimal";
 straight.min="0";
 straight.step="0.01";
 straight.placeholder="D";
 straight.dataset.field="straight";

 const rumble=document.createElement("input");
 rumble.type="number";
 rumble.inputMode="decimal";
 rumble.min="0";
 rumble.step="0.01";
 rumble.placeholder="R";
 rumble.dataset.field="rumble";

 const remove=document.createElement("button");
 remove.type="button";
 remove.className="remove-btn";
 remove.textContent="×";
 remove.title="Clear or remove row";

 row.append(
  serial,
  number,
  straight,
  rumble,
  remove
 );

 rowsContainer.appendChild(row);

 [number,straight,rumble].forEach(input=>{

  input.addEventListener("input",()=>{

   if(input===number){
    input.value=input.value.replace(/\D/g,"").slice(0,3);
   }

   calculate();
  });

 });

 remove.addEventListener("click",()=>{

  if(bettingLocked||submitting||!authenticated){
   return;
  }

  const count=
   rowsContainer.querySelectorAll(".bet-row").length;

  if(count>MIN_ROWS){
   row.remove();
  }else{
   number.value="";
   straight.value="";
   rumble.value="";
  }

  updateSerials();
  calculate();
 });

 updateSerials();
 calculate();
}

function addRow(){

 if(bettingLocked||submitting||!authenticated){
  showMessage("Betting is currently unavailable.","error");
  return;
 }

 const count=
  rowsContainer.querySelectorAll(".bet-row").length;

 if(count>=MAX_ROWS){
  showMessage("Maximum 50 rows allowed.","error");
  return;
 }

 createRow();
}

function resetRows(){

 rowsContainer.replaceChildren();

 for(let i=0;i<MIN_ROWS;i++){
  createRow();
 }

 updateSerials();
 calculate();
}

/* =========================================
   READ ROWS
========================================= */

function getRows(){

 const result=[];

 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{

  const number=
   row.querySelector('[data-field="number"]').value.trim();

  const d=
   row.querySelector('[data-field="straight"]').value.trim();

  const r=
   row.querySelector('[data-field="rumble"]').value.trim();

  if(number===""&&d===""&&r===""){
   return;
  }

  result.push({
   number,
   straight:d===""?0:Number(d),
   rumble:r===""?0:Number(r)
  });

 });

 return result;
}

/* =========================================
   CALCULATION
========================================= */

function calculate(){

 let total=0;

 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{

  const number=
   row.querySelector('[data-field="number"]').value.trim();

  if(!number)return;

  const d=
   row.querySelector('[data-field="straight"]').value;

  const r=
   row.querySelector('[data-field="rumble"]').value;

  const straight=d===""?0:Number(d);
  const rumble=r===""?0:Number(r);

  if(Number.isFinite(straight)&&straight>0){
   total+=straight;
  }

  if(Number.isFinite(rumble)&&rumble>0){
   total+=rumble;
  }

 });

 const discountAmount=Math.round(total*discount)/100;
 const finalAmount=total-discountAmount;

 totalElement.textContent=formatPoints(total);
 discountElement.textContent=formatPoints(discountAmount);
 betAmountElement.textContent=formatPoints(finalAmount);

 return{
  total,
  discount,
  discountAmount,
  finalAmount
 };
}

/* =========================================
   VALIDATION
========================================= */

function validateRows(rows){

 if(!rows.length){
  showMessage(
   "Please enter a 3 digit number with a D or R amount.",
   "error"
  );
  return false;
 }

 let total=0;

 for(let i=0;i<rows.length;i++){

  const row=rows[i];

  if(!/^\d{3}$/.test(row.number)){
   showMessage(
    "Row "+(i+1)+": number must contain exactly 3 digits (000-999).",
    "error"
   );
   return false;
  }

  if(
   !Number.isFinite(row.straight)||
   !Number.isFinite(row.rumble)||
   row.straight<0||
   row.rumble<0||
   Math.round(row.straight*100)!==row.straight*100||
   Math.round(row.rumble*100)!==row.rumble*100
  ){
   showMessage(
    "Row "+(i+1)+": enter valid amounts with up to 2 decimal places.",
    "error"
   );
   return false;
  }

  if(row.straight===0&&row.rumble===0){
   showMessage(
    "Row "+(i+1)+": enter a Straight (D) or Rumble (R) amount.",
    "error"
   );
   return false;
  }

  total+=row.straight+row.rumble;

  if(total>MAX_BET_AMOUNT){
   showMessage(
    "Total amount cannot exceed 100000 DEMO points.",
    "error"
   );
   return false;
  }

 }

 return true;
}

/* =========================================
   REFRESH SERVER STATE
========================================= */

async function refreshServerState(){

 if(refreshBusy)return;

 refreshBusy=true;

 try{

  await loadCurrentUser();
  await loadWallet();
  await loadSettings();

  clearMessage();

 }catch(error){

  console.error("3 UP refresh error:",error);

  if(error.status===401){
   authenticated=false;
   serverSettingsLoaded=false;
   redirectToLogin();
   return;
  }

  serverSettingsLoaded=false;
  serverBettingLocked=true;

  setBettingStatus(
   true,
   "SERVER SETTINGS UNAVAILABLE",
   error.message||"Could not verify the current draw schedule."
  );

  showMessage(
   error.message||"Could not load your account or settings.",
   "error"
  );

 }finally{

  refreshBusy=false;
  applyBettingLock();

 }
}

/* =========================================
   SUBMIT 3 UP BET
   Existing endpoint:
   POST /api/demo/3up/bets

   Payload:
   { rows: [...] }
========================================= */

async function submitBet(){

 if(submitting)return;

 clearMessage();

 if(!authenticated){
  redirectToLogin();
  return;
 }

 if(!serverSettingsLoaded||bettingLocked){
  updateBettingStatus();

  showMessage(
   "Betting is currently closed. Please check the draw schedule.",
   "error"
  );

  return;
 }

 const rows=getRows();

 if(!validateRows(rows))return;

 const result=calculate();

 if(
  result.total<=0||
  result.finalAmount<=0
 ){
  showMessage(
   "Please enter an amount greater than zero.",
   "error"
  );
  return;
 }

 if(result.finalAmount>wallet){
  showMessage(
   "Insufficient demo points. Current balance: "+
   formatPoints(wallet),
   "error"
  );
  return;
 }

 const confirmed=confirm(
  "Confirm your 3 UP demo entry?\n\n"+
  "Entries: "+rows.length+
  "\nTotal Amount: "+formatPoints(result.total)+
  " Points"+
  "\nDiscount: "+formatPoints(result.discountAmount)+
  " Points"+
  "\nPayable Amount: "+formatPoints(result.finalAmount)+
  " Points\n\n"+
  "The server will verify your entry and wallet balance."
 );

 if(!confirmed)return;

 submitting=true;
 applyBettingLock();

 try{

  /*
   * Refresh wallet and draw schedule
   * before submitting.
   */

  await loadWallet();
  await loadSettings();

  if(bettingLocked||!serverSettingsLoaded){
   throw new Error(
    "Betting has closed. Please try the next draw."
   );
  }

  if(result.finalAmount>wallet){
   throw new Error(
    "Insufficient demo points. Current balance: "+
    formatPoints(wallet)
   );
  }

  /*
   * Keep the existing backend payload format.
   */

  const response=await apiRequest(
   "/demo/3up/bets",
   {
    method:"POST",
    body:{
     rows:rows
    }
   }
  );

  const data=unwrap(response);

  const bet=
   data.bet||
   data.result||
   {};

  /*
   * Reload authoritative wallet balance.
   */

  try{
   await loadWallet();
  }catch(walletError){

   const returnedBalance=
    data.balance??
    data.wallet_balance??
    bet.balance;

   if(returnedBalance!==undefined){
    setWallet(returnedBalance);
   }else{
    throw walletError;
   }
  }

  const charged=Number(
   bet.payable_amount??
   data.payable_amount??
   data.charged_amount??
   result.finalAmount
  );

  showMessage(
   "3 UP entry saved successfully!\n"+
   "Bet ID: "+(bet.id??data.bet_id??"Confirmed")+
   "\nEntries: "+rows.length+
   "\nBet Amount: "+formatPoints(charged)+
   " Points"+
   "\nRemaining Points: "+formatPoints(wallet),
   "success"
  );

  resetRows();

  await loadSettings();

 }catch(error){

  console.error("3 UP submit error:",error);

  if(error.status===401){
   authenticated=false;
   redirectToLogin();
   return;
  }

  showMessage(
   error.message||"Could not submit your 3 UP entry.",
   "error"
  );

  /*
   * Refresh wallet and settings after failure.
   * Do not automatically retry the bet.
   */

  try{
   await loadWallet();
  }catch(walletError){
   console.warn("Wallet refresh error:",walletError);
  }

  try{
   await loadSettings();
  }catch(settingsError){
   serverSettingsLoaded=false;
   setBettingStatus(
    true,
    "SERVER SETTINGS UNAVAILABLE",
    "Could not verify the current draw schedule."
   );
  }

 }finally{

  submitting=false;
  applyBettingLock();

 }
}

/* =========================================
   EVENTS
========================================= */

addButton.addEventListener("click",addRow);

placeButton.addEventListener("click",submitBet);

document.getElementById("backHome").addEventListener(
 "click",
 ()=>{
  location.href="home.html";
 }
);

/* =========================================
   INITIALIZATION
========================================= */

function initialize(){

 resetRows();

 setBettingStatus(
  true,
  "LOADING BETTING STATUS",
  "Connecting to the server…"
 );

}

async function startPage(){

 initialize();

 await refreshServerState();

 if(!countdownTimer){

  countdownTimer=setInterval(()=>{
   if(serverSettingsLoaded){
    updateBettingStatus();
   }
  },1000);

 }

 setInterval(async()=>{

  if(!submitting&&!refreshBusy){
   try{
    await loadSettings();
   }catch(error){

    console.error("3 UP settings refresh error:",error);

    serverSettingsLoaded=false;

    setBettingStatus(
     true,
     "SERVER SETTINGS UNAVAILABLE",
     "Could not verify the current draw schedule. Betting is disabled."
    );
   }
  }

 },30000);

}

window.addEventListener("focus",()=>{
 if(!submitting&&!refreshBusy){
  refreshServerState();
 }
});

window.addEventListener("pageshow",()=>{
 if(!submitting&&!refreshBusy){
  refreshServerState();
 }
});

startPage();

</script>
