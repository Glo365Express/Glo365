<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2196e8">
<title>GLO 365 - 3 UP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,sans-serif;
 background:#f0f7fd;
 color:#18334d
}

.app{
 max-width:520px;
 min-height:100vh;
 margin:auto;
 background:#fff;
 padding-bottom:25px;
 box-shadow:0 0 25px #163c5c0b
}

.header{
 background:linear-gradient(120deg,#1687d5,#2196e8);
 padding:17px 15px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{font-size:27px;font-weight:900;color:#fff}
.logo span{color:#d9f0ff}

.balance{
 background:#fff;
 color:#167fc4;
 padding:10px 14px;
 border-radius:30px;
 font-size:13px;
 font-weight:bold
}

.page-title{
 background:#2196e8;
 text-align:center;
 padding:15px 10px;
 font-size:19px;
 font-weight:900;
 color:#fff
}

.subtitle{
 text-align:center;
 padding:12px 5px;
 background:#eff8ff;
 color:#167fc4;
 font-size:13px;
 font-weight:bold
}

.bet-area{padding:8px 9px 0}

.column-heading,.bet-row{
 display:grid;
 grid-template-columns:23px minmax(0,1.05fr) minmax(0,.9fr) minmax(0,.9fr) 20px;
 gap:5px
}

.column-heading{
 padding:8px 0;
 font-size:10px;
 font-weight:bold;
 color:#8195a8;
 text-align:center
}

.bet-row{
 align-items:center;
 margin-bottom:8px
}

.serial{
 text-align:center;
 font-size:14px;
 color:#526f87
}

.bet-row input{
 width:100%;
 min-width:0;
 height:49px;
 border:1px solid #cbdfee;
 background:#f7fbff;
 border-radius:10px;
 text-align:center;
 font-size:14px;
 color:#18334d;
 outline:none;
 padding:4px
}

.bet-row input:focus{
 border-color:#2196e8;
 background:#fff;
 box-shadow:0 0 0 3px #2196e817
}

.bet-row input::placeholder{color:#9aabba}

.remove-btn{
 border:0;
 background:transparent;
 color:#d34c5e;
 font-size:20px;
 font-weight:bold;
 padding:3px 0;
 cursor:pointer
}

.add-area{
 display:flex;
 justify-content:flex-end;
 padding:5px 3px 17px
}

.add-btn{
 width:43px;
 height:43px;
 border-radius:50%;
 background:#eff8ff;
 color:#1687d5;
 border:1px solid #cbdfee;
 font-size:29px;
 font-weight:bold;
 display:grid;
 place-items:center;
 cursor:pointer
}

.add-btn:disabled{opacity:.4;cursor:not-allowed}

.summary{padding:5px 11px}

.summary-box{
 background:#eff8ff;
 border:1px solid #dcebf6;
 border-radius:12px;
 padding:16px 7px;
 text-align:center;
 font-size:14px;
 margin-bottom:9px;
 color:#526f87
}

.summary-box strong{font-weight:900;color:#167fc4}

.discount-line{
 display:flex;
 align-items:center;
 justify-content:center;
 flex-wrap:wrap;
 gap:7px
}

.discount-value{
 background:#fff;
 border:1px solid #cbdfee;
 border-radius:7px;
 min-width:55px;
 padding:7px 9px;
 font-weight:bold;
 color:#167fc4
}

.discount-percent{color:#526f87;font-weight:bold}
.discount-amount{font-weight:bold;color:#1687d5}

.place-btn{
 width:calc(100% - 22px);
 margin:17px 11px 0;
 padding:16px 8px;
 background:linear-gradient(90deg,#1687d5,#2196e8);
 border:0;
 border-radius:10px;
 color:#fff;
 font-size:17px;
 font-weight:900;
 box-shadow:0 4px 12px #1687d530;
 cursor:pointer
}

.place-btn:active{transform:scale(.98)}
.place-btn:disabled{opacity:.6;cursor:not-allowed}

/* BETTING LOCK */

.lock-status{
 display:none;
 margin:12px 11px;
 padding:14px 12px;
 border:1px solid #f0b8b8;
 border-radius:10px;
 background:#fff0f0;
 color:#b42332;
 text-align:center;
 font-size:13px;
 font-weight:bold;
 line-height:1.7
}

.lock-status.locked{display:block}

.lock-status.open{
 display:block;
 border-color:#b9e4ca;
 background:#effbf3;
 color:#187344
}

.lock-status strong{
 display:block;
 font-size:14px;
 margin-bottom:3px
}

.bet-row input:disabled{
 background:#edf0f3;
 color:#8795a1;
 cursor:not-allowed;
 opacity:.7
}

.remove-btn:disabled{
 opacity:.3;
 cursor:not-allowed
}

/* ADSTERRA BANNER */

.ad-container{
 width:100%;
 min-height:58px;
 margin:10px auto 8px;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow:hidden;
 background:#fff
}

.ad-container iframe{max-width:100%;border:0}

.back-btn{
 display:block;
 margin:10px auto;
 border:0;
 background:transparent;
 color:#167fc4;
 padding:10px;
 font-size:13px;
 cursor:pointer
}

.notice{
 margin:10px 11px;
 padding:12px;
 background:#eff8ff;
 border:1px solid #dcebf6;
 border-radius:9px;
 text-align:center;
 color:#526f87;
 font-size:11px;
 line-height:1.7
}

.notice strong{color:#167fc4}

@media(max-width:380px){
 .logo{font-size:24px}
 .balance{font-size:11px;padding:9px}
 .bet-row input{height:45px;font-size:12px}
 .column-heading{font-size:9px;gap:3px}
 .bet-row{gap:3px}
 .serial{font-size:12px}
 .summary-box{font-size:13px}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
 <div class="logo">GLO <span>365</span></div>
 <div class="balance">
  <span id="balance">0.00</span> Points
 </div>
</header>

<div class="page-title">3 UP NUMBER</div>
<div class="subtitle">Enter 3 Digit Number &amp; Virtual Points</div>

<!-- BETTING LOCK STATUS -->
<div id="lockStatus" class="lock-status">
 <strong id="lockTitle">BETTING STATUS</strong>
 <span id="lockMessage"></span>
</div>

<section class="bet-area">

 <div class="column-heading">
  <span>#</span>
  <span>NUMBER</span>
  <span>STRAIGHT (D)</span>
  <span>RUMBLE (R)</span>
  <span></span>
 </div>

 <div id="betRows"></div>

 <div class="add-area">
  <button class="add-btn" id="addRow" type="button" title="Add more rows">+</button>
 </div>

</section>

<section class="summary">

 <div class="summary-box">
  Total Amount = <strong id="totalAmount">0.00</strong> Points
 </div>

 <div class="summary-box">
  <div class="discount-line">
   <span>Discount</span>
   <span class="discount-value" id="discountPercent">0</span>
   <span class="discount-percent">%</span>
   <strong class="discount-amount" id="discountAmount">0.00</strong>
   <span>Points</span>
  </div>
 </div>

 <div class="summary-box">
  Bet Amount = <strong id="betAmount">0.00</strong> Points
 </div>

</section>

<button class="place-btn" id="placeBet" type="button">
 PLACE DEMO BET
</button>

<!-- ADSTERRA 320x50 BANNER -->
<div class="ad-container">
 <script>
  var atOptions = {
   'key' : 'ab837cf0ea9c26ae43b7bc4e05a0b5de',
   'format' : 'iframe',
   'height' : 50,
   'width' : 320,
   'params' : {}
  };
 </script>
 <script src="https://bicea.org/22/ab837cf0ea9c26ae43b7bc4e05a0b5de"></script>
</div>

<button class="back-btn" onclick="location.href='home.html'">
 ← Back to Home
</button>

<div class="notice">
 <strong>DEMO MODE ONLY</strong><br>
 Virtual points are used for testing.<br>
 No real-money transactions or cash payouts.
</div>

</div>

<script>
"use strict";

const STORAGE={
 users:"glo365_users",
 history:"glo365_demo_history",
 discount:"glo365_3up_discount",
 session:"glo365_session",
 pointHistory:"glo365_point_history",

 // Admin draw schedule key
 drawTime:"glo365_draw_time"
};

const MIN_ROWS=10;
const MAX_ROWS=50;
const LOCK_MINUTES=45;
const LOCK_TIME=LOCK_MINUTES*60*1000;

let bettingLocked=true;
let lockReason="";

function readStorage(key,fallback){
 try{
  const value=localStorage.getItem(key);
  return value===null?fallback:JSON.parse(value);
 }catch(error){
  return fallback;
 }
}

/* CURRENT USER */

function getSession(){
 return readStorage(STORAGE.session,null);
}

function getUsers(){
 const users=readStorage(STORAGE.users,[]);
 return Array.isArray(users)?users:[];
}

function getCurrentUser(){
 const session=getSession();

 if(!session||!session.username)return null;

 return getUsers().find(user=>
  String(user.username||"").toLowerCase()===
  String(session.username).toLowerCase()
 )||null;
}

let currentUser=getCurrentUser();

if(!currentUser){
 alert("Please login first.");
 location.replace("login.html");
 throw new Error("User login required.");
}

let wallet=Math.max(0,Number(currentUser.points)||0);
let discount=0;

const rowsContainer=document.getElementById("betRows");
const addButton=document.getElementById("addRow");

const totalElement=document.getElementById("totalAmount");
const discountElement=document.getElementById("discountAmount");
const discountPercentElement=document.getElementById("discountPercent");
const betAmountElement=document.getElementById("betAmount");
const balanceElement=document.getElementById("balance");
const placeButton=document.getElementById("placeBet");

const lockStatus=document.getElementById("lockStatus");
const lockTitle=document.getElementById("lockTitle");
const lockMessage=document.getElementById("lockMessage");

/* DRAW TIME READER */

/*
 Admin page must save the draw date/time using:
 localStorage.setItem(
   "glo365_draw_time",
   JSON.stringify("2026-10-31T20:00")
 );

 The value must be a local date-time string.
*/

function getAdminDrawTime(){
 const raw=localStorage.getItem(STORAGE.drawTime);

 if(raw===null||raw===""){
  return null;
 }

 let value=raw;

 try{
  value=JSON.parse(raw);
 }catch(error){
  value=raw;
 }

 // Support an object format too, if the admin page uses one.
 if(value&&typeof value==="object"){
  value=
   value.drawTime||
   value.dateTime||
   value.datetime||
   value.time||
   value.date||
   null;
 }

 if(typeof value!=="string"||!value.trim()){
  return null;
 }

 const drawDate=new Date(value);

 if(Number.isNaN(drawDate.getTime())){
  return null;
 }

 return drawDate;
}

/* BETTING LOCK CHECK */

function checkBettingLock(){
 const drawDate=getAdminDrawTime();
 const now=Date.now();

 let shouldLock=true;
 let title="";
 let message="";

 if(!drawDate){
  shouldLock=true;
  title="BETTING LOCKED";
  message="Admin has not configured the draw schedule. Please contact the administrator.";
 }else{
  const remaining=drawDate.getTime()-now;

  if(remaining<=LOCK_TIME){
   shouldLock=true;

   if(remaining<=0){
    title="BETTING CLOSED";
    message="The scheduled draw time has passed. Betting is closed.";
   }else{
    const minutes=Math.ceil(remaining/60000);

    title="BETTING CLOSED";
    message=
     "Betting closes 45 minutes before the draw. "+
     "Only "+minutes+" minute(s) remain. New bets are not accepted.";
   }
  }else{
   shouldLock=false;

   const minutes=Math.floor(remaining/60000);
   const hours=Math.floor(minutes/60);
   const remainingMinutes=minutes%60;

   title="BETTING IS OPEN";

   message=
    "Betting is available. It will close 45 minutes before the draw. "+
    "Time remaining: "+hours+"h "+remainingMinutes+"m.";
  }
 }

 bettingLocked=shouldLock;
 lockReason=message;

 lockStatus.className=shouldLock
  ?"lock-status locked"
  :"lock-status open";

 lockTitle.textContent=title;
 lockMessage.textContent=message;

 applyBettingLock();
 return !bettingLocked;
}

/* ENABLE / DISABLE BETTING CONTROLS */

function applyBettingLock(){
 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{
  row.querySelectorAll("input").forEach(input=>{
   input.disabled=bettingLocked;
  });

  const remove=row.querySelector(".remove-btn");

  if(remove){
   remove.disabled=bettingLocked;
  }
 });

 updateAddButton();

 placeButton.disabled=bettingLocked;

 placeButton.textContent=bettingLocked
  ?"BETTING CLOSED"
  :"PLACE DEMO BET";
}

/* ADMIN DISCOUNT */

function loadAdminDiscount(){
 const saved=localStorage.getItem(STORAGE.discount);
 const value=Number(saved);

 discount=(saved!==null&&Number.isFinite(value))
  ?Math.min(100,Math.max(0,value)):0;

 discountPercentElement.textContent=
  discount.toFixed(2).replace(/\.00$/,"");

 calculate();
}

/* WALLET */

function updateWallet(){
 currentUser=getCurrentUser();

 wallet=currentUser?
  Math.max(0,Number(currentUser.points)||0):0;

 balanceElement.textContent=wallet.toFixed(2);
}

/* CREATE ROW */

function addRow(force=false){
 if(bettingLocked&&!force){
  alert("Betting is currently closed.");
  return;
 }

 const count=rowsContainer.querySelectorAll(".bet-row").length;

 if(count>=MAX_ROWS){
  alert("Maximum 50 rows allowed.");
  return;
 }

 const row=document.createElement("div");
 row.className="bet-row";

 const serial=document.createElement("span");
 serial.className="serial";

 const number=document.createElement("input");
 number.type="text";
 number.inputMode="numeric";
 number.maxLength=3;
 number.placeholder="Number";
 number.dataset.field="number";

 const straight=document.createElement("input");
 straight.type="number";
 straight.inputMode="decimal";
 straight.min="0";
 straight.step="0.01";
 straight.placeholder="D";
 straight.dataset.field="straight";

 const rumble=document.createElement("input");
 rumble.type="number";
 rumble.inputMode="decimal";
 rumble.min="0";
 rumble.step="0.01";
 rumble.placeholder="R";
 rumble.dataset.field="rumble";

 const remove=document.createElement("button");
 remove.type="button";
 remove.className="remove-btn";
 remove.textContent="×";
 remove.title="Clear or remove row";

 row.append(serial,number,straight,rumble,remove);
 rowsContainer.appendChild(row);

 [number,straight,rumble].forEach(input=>{
  input.addEventListener("input",()=>{
   if(bettingLocked)return;

   if(input===number){
    input.value=input.value.replace(/\D/g,"").slice(0,3);
   }

   calculate();
  });
 });

 remove.addEventListener("click",()=>{
  checkBettingLock();

  if(bettingLocked){
   alert("Betting is currently closed.");
   return;
  }

  const currentCount=rowsContainer.querySelectorAll(".bet-row").length;

  if(currentCount>MIN_ROWS){
   row.remove();
  }else{
   number.value="";
   straight.value="";
   rumble.value="";
  }

  updateSerials();
  calculate();
 });

 updateSerials();
 calculate();
 applyBettingLock();
}

/* SERIALS AND ROW LIMIT */

function updateSerials(){
 rowsContainer.querySelectorAll(".bet-row").forEach((row,index)=>{
  row.querySelector(".serial").textContent=(index+1)+".";
 });

 updateAddButton();
}

function updateAddButton(){
 const count=rowsContainer.querySelectorAll(".bet-row").length;

 addButton.disabled=bettingLocked||count>=MAX_ROWS;

 addButton.title=bettingLocked
  ?"Betting is closed"
  :count>=MAX_ROWS
   ?"Maximum 50 rows reached"
   :"Add row ("+count+"/50)";
}

addButton.addEventListener("click",()=>{
 checkBettingLock();

 if(bettingLocked){
  alert("Betting is currently closed.");
  return;
 }

 addRow();
});

/* GET VALID ROW DATA */

function getRows(){
 const data=[];

 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{
  const number=row.querySelector('[data-field="number"]').value.trim();

  const dValue=row.querySelector('[data-field="straight"]').value;
  const rValue=row.querySelector('[data-field="rumble"]').value;

  if(number==="")return;
  if(dValue===""&&rValue==="")return;

  const straight=dValue===""?0:Number(dValue);
  const rumble=rValue===""?0:Number(rValue);

  data.push({number,straight,rumble});
 });

 return data;
}

/* CALCULATE */

function calculate(){
 let total=0;

 rowsContainer.querySelectorAll(".bet-row").forEach(row=>{
  const number=row.querySelector('[data-field="number"]').value.trim();

  if(number==="")return;

  const dValue=row.querySelector('[data-field="straight"]').value;
  const rValue=row.querySelector('[data-field="rumble"]').value;

  const d=dValue===""?0:Number(dValue);
  const r=rValue===""?0:Number(rValue);

  if(Number.isFinite(d)&&d>0)total+=d;
  if(Number.isFinite(r)&&r>0)total+=r;
 });

 const discountAmount=total*discount/100;
 const finalAmount=total-discountAmount;

 totalElement.textContent=total.toFixed(2);
 discountElement.textContent=discountAmount.toFixed(2);
 betAmountElement.textContent=finalAmount.toFixed(2);

 return{total,discount,discountAmount,finalAmount};
}

/* VALIDATION */

function validateRows(rows){
 if(rows.length===0){
  alert("কমপক্ষে একটি Number এবং D অথবা R Points দিন।");
  return false;
 }

 for(const row of rows){
  if(!/^\d{3}$/.test(row.number)){
   alert("3 UP Number must contain exactly three digits (000-999).");
   return false;
  }

  if(
   !Number.isFinite(row.straight)||
   !Number.isFinite(row.rumble)||
   row.straight<0||
   row.rumble<0
  ){
   alert("Please enter valid non-negative amounts.");
   return false;
  }

  if(row.straight===0&&row.rumble===0){
   alert("D অথবা R-এর যেকোনো একটিতে পয়েন্ট দিন।");
   return false;
  }
 }

 return true;
}

/* SAVE ENTRY WITH USERNAME AND WALLET HISTORY */

placeButton.addEventListener("click",()=>{
 // Recheck the admin schedule at the exact moment of submission.
 checkBettingLock();

 if(bettingLocked){
  alert("Betting is closed. Bets cannot be submitted within 45 minutes of the draw.");
  return;
 }

 currentUser=getCurrentUser();

 if(!currentUser){
  alert("Your login session has expired. Please login again.");
  location.replace("login.html");
  return;
 }

 const rows=getRows();
 const result=calculate();

 if(!validateRows(rows))return;

 // Check the lock once more before saving.
 if(!checkBettingLock()){
  // Betting is open.
 }else{
  alert("Betting is closed.");
  return;
 }

 if(result.finalAmount<=0){
  alert("Please enter a valid amount.");
  return;
 }

 updateWallet();

 if(result.finalAmount>wallet){
  alert("Insufficient demo points.");
  return;
 }

 const users=getUsers();

 const userIndex=users.findIndex(user=>
  String(user.username||"").toLowerCase()===
  String(currentUser.username).toLowerCase()
 );

 if(userIndex===-1){
  alert("User account not found.");
  return;
 }

 const history=readStorage(STORAGE.history,[]);
 const safeHistory=Array.isArray(history)?history:[];

 const pointHistory=readStorage(STORAGE.pointHistory,[]);
 const safePointHistory=Array.isArray(pointHistory)?pointHistory:[];

 const now=new Date();

 const entryId="3UP"+Date.now()+"-"+Math.random().toString(36).slice(2,7);

 const newBalance=wallet-result.finalAmount;

 const entry={
  id:entryId,
  game:"3up",
  username:currentUser.username,
  rows:rows,
  total:result.total,
  discount:result.discount,
  discountValue:result.discountAmount,
  amount:result.finalAmount,
  createdAt:now.toISOString(),
  submittedAt:now.getTime(),
  timestamp:now.getTime(),
  date:now.toLocaleString(),
  status:"DEMO SAVED"
 };

 const debitRecord={
  id:"PH"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
  username:currentUser.username,
  type:"debit",
  amount:result.finalAmount,
  reason:"3 UP Bet",
  referenceId:entryId,
  date:now.toISOString(),
  createdAt:now.toISOString(),
  timestamp:now.getTime()
 };

 /* Preserve all existing user properties */

 const updatedUser={
  ...users[userIndex],
  points:newBalance
 };

 users[userIndex]=updatedUser;

 try{
  // Final lock check immediately before storage writes.
  if(!checkBettingLock()){
   // Still open.
  }else{
   throw new Error("Betting closed before saving.");
  }

  localStorage.setItem(STORAGE.users,JSON.stringify(users));

  safeHistory.unshift(entry);
  localStorage.setItem(STORAGE.history,JSON.stringify(safeHistory));

  safePointHistory.unshift(debitRecord);
  localStorage.setItem(STORAGE.pointHistory,JSON.stringify(safePointHistory));

  /* Verify saved data */

  const verifyUsers=readStorage(STORAGE.users,[]);
  const verifyUser=Array.isArray(verifyUsers)?
   verifyUsers.find(user=>
    String(user.username||"").toLowerCase()===
    String(currentUser.username).toLowerCase()
   ):null;

  const verifyHistory=readStorage(STORAGE.history,[]);
  const verifyPointHistory=readStorage(STORAGE.pointHistory,[]);

  const userSaved=verifyUser&&
   Number(verifyUser.points)===newBalance;

  const betSaved=Array.isArray(verifyHistory)&&
   verifyHistory.some(item=>String(item.id)===entryId);

  const debitSaved=Array.isArray(verifyPointHistory)&&
   verifyPointHistory.some(item=>String(item.referenceId)===entryId);

  if(!userSaved||!betSaved||!debitSaved){
   throw new Error("Save verification failed");
  }

  wallet=newBalance;
  updateWallet();

  alert(
   "3 UP demo entry saved successfully!"+
   "\nUsername: "+currentUser.username+
   "\nBet Amount: "+result.finalAmount.toFixed(2)+
   "\nRemaining Points: "+wallet.toFixed(2)
  );

  resetRows();

 }catch(error){
  console.error("3 UP bet save error:",error);

  alert(
   error.message==="Betting closed before saving."
    ?"Betting is closed. Your entry was not accepted."
    :"Bet save could not be verified. Please check your browser storage before retrying."
  );
 }
});

/* RESET */

function resetRows(){
 rowsContainer.replaceChildren();

 for(let i=0;i<MIN_ROWS;i++){
  addRow(true);
 }

 calculate();
 applyBettingLock();
}

/* STORAGE SYNC */

window.addEventListener("storage",event=>{
 if(
  event.key===STORAGE.discount||
  event.key===STORAGE.users||
  event.key===STORAGE.drawTime||
  event.key===null
 ){
  if(event.key===STORAGE.discount||event.key===null){
   loadAdminDiscount();
  }

  if(event.key===STORAGE.users||event.key===null){
   updateWallet();
  }

  if(event.key===STORAGE.drawTime||event.key===null){
   checkBettingLock();
  }
 }
});

window.addEventListener("focus",()=>{
 loadAdminDiscount();
 updateWallet();
 checkBettingLock();
});

window.addEventListener("pageshow",()=>{
 loadAdminDiscount();
 updateWallet();
 checkBettingLock();
});

/* LIVE TIMER CHECK */

setInterval(()=>{
 checkBettingLock();
},1000);

/* INITIALIZE */

resetRows();
loadAdminDiscount();
updateWallet();
checkBettingLock();

</script>
</body>
</html>
