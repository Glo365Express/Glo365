<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>GLO 365</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#080b18;
    color:white;
    min-height:100vh;
    overflow:hidden;
}

.splash{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
    position:relative;
    background:
        radial-gradient(circle at 50% 40%,
        rgba(0,220,255,.15),
        transparent 35%),
        radial-gradient(circle at 20% 80%,
        rgba(110,60,255,.15),
        transparent 35%),
        #080b18;
}

.glow{
    position:absolute;
    width:240px;
    height:240px;
    background:#00d9ff;
    filter:blur(130px);
    opacity:.18;
    border-radius:50%;
}

/* CUSTOM LOGO */

.logo{
    width:155px;
    height:155px;
    border-radius:35px;
    position:relative;
    z-index:1;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,#20b5ff,#0875d9);
    box-shadow:
        0 0 45px rgba(0,180,255,.35),
        inset 0 3px 10px #ffffff45,
        inset 0 -8px 18px #003d8c55;
    animation:float 3s ease-in-out infinite;
    overflow:hidden;
}

.logo::before{
    content:"";
    position:absolute;
    width:125px;
    height:125px;
    border-radius:50%;
    background:#ffffff0b;
    border:1px solid #ffffff35;
}

.logo svg{
    width:94%;
    height:94%;
    position:relative;
    z-index:2;
    filter:drop-shadow(0 3px 3px #001e4d80);
}

.logo-glow{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#ffffff;
    opacity:.12;
    filter:blur(25px);
}

/* PREMIUM GLO 365 BRAND NAME */

.brand-name{
    position:relative;
    z-index:2;
    margin-top:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:48px;
    font-weight:1000;
    letter-spacing:4px;
    line-height:1.1;
    filter:drop-shadow(0 5px 12px #00aaff35);
}

.brand-glo{
    background:linear-gradient(
        180deg,
        #ffffff 0%,
        #d9efff 28%,
        #91cfff 52%,
        #ffffff 75%,
        #7db9e8 100%
    );
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 22px #70caff35;
}

.brand-number{
    background:linear-gradient(
        180deg,
        #b8f5ff 0%,
        #36d8ff 35%,
        #078ce8 70%,
        #75caff 100%
    );
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px #00bfff70);
}

.brand-line{
    width:125px;
    height:3px;
    margin:12px auto 0;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        transparent,
        #42d9ff,
        #ffffff,
        #42d9ff,
        transparent
    );
    box-shadow:0 0 12px #00c8ff80;
}

/* TAGLINE */

.tagline{
    margin-top:14px;
    font-size:12px;
    color:#aab5cc;
    letter-spacing:4px;
    font-weight:bold;
}

.description{
    margin-top:55px;
    font-size:14px;
    color:#8995ae;
    text-align:center;
    line-height:1.7;
}

/* LOADER */

.loader{
    width:190px;
    height:4px;
    background:#202a40;
    border-radius:20px;
    overflow:hidden;
    margin-top:30px;
}

.loader span{
    display:block;
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00d9ff,#8060ff);
    animation:loading 3s linear forwards;
}

.loading-text{
    margin-top:12px;
    font-size:11px;
    color:#77849d;
    letter-spacing:2px;
}

.footer{
    position:absolute;
    bottom:25px;
    color:#56627b;
    font-size:11px;
    letter-spacing:2px;
    text-align:center;
}

/* ANIMATIONS */

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

@keyframes loading{
    from{width:0%}
    to{width:100%}
}

.fade-out{
    animation:fade .5s forwards;
}

@keyframes fade{
    to{
        opacity:0;
        transform:scale(1.05);
    }
}

@media(max-width:480px){
    .brand-name{
        font-size:40px;
        letter-spacing:3px;
        gap:7px;
    }

    .logo{
        width:140px;
        height:140px;
    }
}

@media(max-width:350px){
    .brand-name{
        font-size:34px;
        letter-spacing:2px;
    }
}
</style>
</head>

<body>

            <path
                d="M85 146 H115"

        </svg>

    </div>

    <!-- PREMIUM BRAND NAME -->

    <div class="brand-name">
        <span class="brand-glo">GLO</span>

    </div>

    <p class="tagline">YOUR WORLD. EVERY DAY.</p>

    <p class="description">

<script>

/* AUTOMATIC REDIRECT TO LOGIN */

const splash = document.getElementById("splash");
const loadingText = document.getElementById("loadingText");

setTimeout(function(){

    loadingText.innerText = "OPENING LOGIN PAGE...";

    splash.classList.add("fade-out");

    setTimeout(function(){

        window.location.replace("login.html");

    },500);

},3000);

</script>

</html>
