<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edf8ff">
<title>Thailand Lottery - GLO 365</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#edf8ff;
    color:#064477;
    min-height:100vh;
}
.top-area{
    width:100%;
    max-width:650px;
    height:58px;
    margin:0 auto;
    padding:9px 14px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    background:transparent;
}
.back-btn{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    color:#fff;
    text-decoration:none;
    font-size:29px;
    font-weight:700;
    line-height:1;
    background:linear-gradient(145deg,#087fda,#0752a4);
    border:2px solid #ffffff;
    box-shadow:0 3px 10px #075ba944,inset 0 1px 2px #ffffff66;
    transition:transform .15s ease,filter .15s ease;
}
.back-btn:active{
    transform:scale(.93);
    filter:brightness(1.12);
}
.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:5px 12px 30px;
}

/* Official Thailand Government Lottery photo banner */
.thailand-banner{
    height:155px;
    width:100%;
    border-radius:17px;
    overflow:hidden;
    position:relative;
    margin-bottom:18px;
    background:#073b91;
    box-shadow:0 4px 12px #0879c955;
    border:3px solid #fff;
}
.thailand-banner img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 38%;
}

/* Section title */
.section-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin:10px 3px 14px;
    color:#075baa;
    font-size:18px;
    font-weight:900;
}
.section-title span{
    font-size:23px;
}

/* Game grid */
.game-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}
.game-card{
    min-width:0;
    height:310px;
    position:relative;
    overflow:hidden;
    border-radius:25px;
    border:4px solid #fff;
    outline:2px solid #8bd8ff;
    background:
      radial-gradient(ellipse at 50% 35%,#34d9ff 0%,#12a9ef 48%,#0872d5 100%);
    box-shadow:
      0 5px 12px #0879c955,
      inset 0 0 15px #ffffff77;
    text-decoration:none;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:13px 8px 10px;
    transition:transform .15s ease;
}
.game-card:active{transform:scale(.97);}
.game-card:before{
    content:"";
    position:absolute;
    width:150%;
    height:100px;
    left:-25%;
    top:115px;
    border-top:2px solid #ffffff55;
    border-radius:50%;
    transform:rotate(-8deg);
    pointer-events:none;
}
.crown{
    font-size:48px;
    line-height:1.1;
    filter:drop-shadow(0 3px 3px #00559a88);
    z-index:1;
}
.balls{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:76px;
    gap:3px;
    margin-top:5px;
    z-index:1;
}
.ball{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 35% 25%,#fff,#d7f5ff 55%,#8bd9f7);
    border:5px solid #17caff;
    box-shadow:0 3px 6px #004d9b88,inset 0 0 5px #fff;
    color:#172f49;
    font-size:31px;
    font-weight:900;
}
.ball.pink{border-color:#ff2582;}
.ball.green{border-color:#13d77c;}
.ball.small{
    width:36px;
    height:36px;
    font-size:18px;
    border-width:4px;
}
.game-name{
    font-size:30px;
    font-weight:900;
    letter-spacing:1px;
    margin-top:7px;
    text-shadow:2px 3px 3px #00549b;
    z-index:1;
    white-space:nowrap;
}
.game-subtitle{
    font-size:13px;
    font-weight:900;
    margin-top:3px;
    text-shadow:1px 2px 3px #00549b;
    z-index:1;
    white-space:nowrap;
}
.play-btn{
    width:95%;
    height:48px;
    border-radius:30px;
    background:#fff;
    color:#064b91;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 9px 0 14px;
    font-size:14px;
    font-weight:900;
    margin-top:auto;
    box-shadow:0 3px 6px #004e9c66;
    z-index:2;
    white-space:nowrap;
}
.arrow{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#087ee2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}
.pink-arrow{background:#ee1681;}
.green-arrow{background:#08a65c;}
.footer-note{
    text-align:center;
    color:#39749e;
    font-size:12px;
    font-weight:bold;
    margin:24px 0 8px;
    padding:12px;
    background:#fff;
    border-radius:12px;
    border:1px solid #c9eaff;
}
@media(max-width:360px){
    .thailand-banner{height:140px;}
    .game-card{
        height:275px;
        padding:10px 5px 8px;
    }
    .crown{font-size:40px;}
    .ball{
        width:48px;
        height:48px;
        font-size:26px;
    }
    .ball.small{
        width:30px;
        height:30px;
        font-size:15px;
    }
    .game-name{font-size:24px;}
    .game-subtitle{font-size:11px;}
    .play-btn{font-size:12px;height:43px;}
    .arrow{width:32px;height:32px;}
}
</style>
</head>
