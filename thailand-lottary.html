<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edf8ff">
<title>Thailand Lottery - GLO 365</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#edf8ff;
    color:#064477;
    min-height:100vh;
}
.top-area{
    width:100%;
    max-width:650px;
    height:58px;
    margin:0 auto;
    padding:9px 14px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    background:transparent;
}
.back-btn{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    color:#fff;
    text-decoration:none;
    font-size:29px;
    font-weight:700;
    line-height:1;
    background:linear-gradient(145deg,#087fda,#0752a4);
    border:2px solid #ffffff;
    box-shadow:0 3px 10px #075ba944,inset 0 1px 2px #ffffff66;
    transition:transform .15s ease,filter .15s ease;
}
.back-btn:active{
    transform:scale(.93);
    filter:brightness(1.12);
}
.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:5px 12px 30px;
}

/* Official Thailand Government Lottery photo banner */
.thailand-banner{
    height:155px;
    width:100%;
    border-radius:17px;
    overflow:hidden;
    position:relative;
    margin-bottom:18px;
    background:#073b91;
    box-shadow:0 4px 12px #0879c955;
    border:3px solid #fff;
}
.thailand-banner img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 38%;
}

/* Section title */
.section-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin:10px 3px 14px;
    color:#075baa;
    font-size:18px;
    font-weight:900;
}
.section-title span{
    font-size:23px;
}

/* Game grid */
.game-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}
.game-card{
    min-width:0;
    height:310px;
    position:relative;
    overflow:hidden;
    border-radius:25px;
    border:4px solid #fff;
    outline:2px solid #8bd8ff;
    background:
      radial-gradient(ellipse at 50% 35%,#34d9ff 0%,#12a9ef 48%,#0872d5 100%);
    box-shadow:
      0 5px 12px #0879c955,
      inset 0 0 15px #ffffff77;
    text-decoration:none;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:7px 6px 9px;
    transition:transform .15s ease;
}
.game-card:active{transform:scale(.97);}
.game-logo{
    display:block;
    width:100%;
    height:238px;
    min-height:0;
    object-fit:contain;
    object-position:center;
    filter:drop-shadow(0 4px 5px #003e8066);
    flex:1 1 auto;
}
.play-btn{
    width:96%;
    height:48px;
    flex:0 0 48px;
    border-radius:30px;
    background:#fff;
    color:#064b91;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 9px 0 14px;
    font-size:14px;
    font-weight:900;
    box-shadow:0 3px 6px #004e9c66;
    z-index:2;
    white-space:nowrap;
}
.arrow{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#087ee2;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}
.pink-arrow{background:#ee1681;}
.green-arrow{background:#08a65c;}
.footer-note{
    text-align:center;
    color:#39749e;
    font-size:12px;
    font-weight:bold;
    margin:24px 0 8px;
    padding:12px;
    background:#fff;
    border-radius:12px;
    border:1px solid #c9eaff;
}
@media(max-width:360px){
    .thailand-banner{height:140px;}
    .game-card{
        height:275px;
        padding:6px 5px 8px;
    }
    .game-logo{height:205px;}
    .play-btn{font-size:12px;height:43px;flex-basis:43px;}
    .arrow{width:32px;height:32px;}
}
</style>
</head>
