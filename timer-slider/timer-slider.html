
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>GLO 365 3D Timer Slider</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
}

#timerSlider{
  position:relative;
  width:100%;
  height:140px;
  overflow:hidden;
  background:transparent;
  perspective:1200px;
  perspective-origin:50% 50%;
}

.timer-stage{
  position:relative;
  width:100%;
  height:140px;
  overflow:hidden;
  transform-style:preserve-3d;
  transform:rotateY(0deg) scale(1);
  opacity:1;
  border-radius:18px;
  will-change:transform,opacity;
  backface-visibility:hidden;
}

.timer-frame{
  display:block;
  width:100%;
  height:140px;
  border:0;
  margin:0;
  padding:0;
  background:transparent;
  overflow:hidden;
  border-radius:18px;
}

/* 3D Flip Out */
.timer-stage.flip-out{
  transform:rotateY(88deg) scale(.88);
  opacity:0;
  transition:
    transform .45s cubic-bezier(.65,0,.35,1),
    opacity .35s ease;
}

/* 3D Flip In */
.timer-stage.flip-in{
  animation:flipIn .85s cubic-bezier(.2,.75,.25,1) both;
}

@keyframes flipIn{
  0%{
    transform:rotateY(-88deg) scale(.88);
    opacity:0;
    filter:blur(5px);
  }

  55%{
    transform:rotateY(10deg) scale(1.025);
    opacity:1;
    filter:blur(0);
  }

  75%{
    transform:rotateY(-4deg) scale(.99);
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
    filter:blur(0);
  }
}

/* Premium 3D light effect */
#timerSlider::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:18px;
  box-shadow:
    0 5px 14px rgba(0,75,160,.13),
    inset 0 1px 3px rgba(255,255,255,.35);
}

@media(prefers-reduced-motion:reduce){
  .timer-stage,
  .timer-stage.flip-out{
    transition:none;
  }

  .timer-stage.flip-in{
    animation:none;
  }
}
</style>
</head>

<body>

<div id="timerSlider" aria-label="GLO 365 3D country timer slider">

  <div class="timer-stage" id="timerStage">

    <iframe
      id="timerFrame"
      class="timer-frame"
      title="Thailand timer"
      src="Thai-Timer.html"
      loading="eager"
      scrolling="no">
    </iframe>

  </div>

</div>

<script>
"use strict";

const TIMER_CARDS = [
  {
    file:"Thai-Timer.html",
    title:"Thailand timer"
  },
  {
    file:"Singapore-Timer.html",
    title:"Singapore Pools timer"
  },
  {
    file:"Malaysia-Timer.html",
    title:"Malaysia Toto timer"
  }
];

const CHANGE_INTERVAL = 7000;
const FLIP_OUT_DURATION = 450;

const frame = document.getElementById("timerFrame");
const stage = document.getElementById("timerStage");

let activeIndex = 0;
let rotationTimer = null;
let switching = false;

function showCard(index){

  if(!TIMER_CARDS.length || switching) return;

  activeIndex = index % TIMER_CARDS.length;

  const card = TIMER_CARDS[activeIndex];

  switching = true;

  /* First rotate the current card away */
  stage.classList.remove("flip-in");
  stage.classList.add("flip-out");

  setTimeout(()=>{

    /* Load next timer after flip-out */
    frame.title = card.title;
    frame.src = card.file;

    stage.classList.remove("flip-out");

    /* Reveal next timer with 3D animation */
    void stage.offsetWidth;

    stage.classList.add("flip-in");

    setTimeout(()=>{

      stage.classList.remove("flip-in");
      switching = false;

    },900);

  },FLIP_OUT_DURATION);
}

function stopSlider(){

  if(rotationTimer){
    clearInterval(rotationTimer);
    rotationTimer = null;
  }
}

function startSlider(){

  stopSlider();

  if(document.hidden) return;

  if(TIMER_CARDS.length <= 1) return;

  rotationTimer = setInterval(()=>{

    if(switching) return;

    showCard(
      (activeIndex + 1) % TIMER_CARDS.length
    );

  },CHANGE_INTERVAL);
}

document.addEventListener("visibilitychange",()=>{

  if(document.hidden){

    stopSlider();

  }else{

    startSlider();

  }

});

startSlider();

</script>

</body>
</html>
