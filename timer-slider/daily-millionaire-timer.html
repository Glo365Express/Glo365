<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Daily Millionaire Timer - GLO 365</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:140px;min-height:140px;overflow:hidden;
  background:transparent;font-family:Arial,Helvetica,sans-serif;
}
.timer-area{
  display:block;width:100%;height:140px;overflow:hidden;perspective:1100px;
}
.timer-banner{
  position:relative;display:block;width:100%;height:140px;aspect-ratio:auto;flex:none;
  overflow:hidden;isolation:isolate;transform-style:preserve-3d;
  border-radius:12px;box-shadow:0 5px 15px rgba(0,35,110,.20);
  animation:bannerFloat 4.8s ease-in-out infinite;
}
.timer-art{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:fill;pointer-events:none;user-select:none;
}

/* Replace only the printed timer digits/labels; keep the original neon frames. */
.time-screen{
  position:absolute;top:29.4%;height:37.2%;width:10.4%;
  transform:translate(-50%,-50%);z-index:2;overflow:hidden;
  border-radius:8px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(38,126,255,.34),transparent 65%),
    linear-gradient(145deg,#071b59 0%,#061448 52%,#08266c 100%);
  box-shadow:inset 0 1px 5px rgba(72,180,255,.35),
             inset 0 -5px 9px rgba(0,0,0,.3);
}
#screenHour{left:44.7%}
#screenMinute{left:62.0%}
#screenSecond{left:79.1%}

.time-value{
  position:absolute;left:0;right:0;top:10%;height:61%;
  display:flex;align-items:center;justify-content:center;
  color:#f7f9ff;font-weight:900;font-size:clamp(22px,8.0vw,55px);
  line-height:1;text-shadow:0 2px 3px rgba(0,0,0,.5),0 0 8px rgba(130,190,255,.45);
  font-variant-numeric:tabular-nums;
}
.time-label{
  position:absolute;left:0;right:0;bottom:5%;height:24%;
  display:flex;align-items:center;justify-content:center;
  color:#f4f7ff;font-weight:900;font-size:clamp(9px,3.0vw,20px);
  line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.55);
}

/* Replace the sample draw number printed on the calendar page. */
.draw-number-cover{
  position:absolute;left:90.0%;top:60.0%;width:12.6%;height:20.5%;
  transform:translate(-50%,-50%);z-index:2;
  background:linear-gradient(145deg,#ffffff 0%,#f8faff 70%,#e9efff 100%);
  border-radius:3px;box-shadow:inset 0 1px 2px rgba(255,255,255,.95);
}
.draw-number{
  position:absolute;left:90.0%;top:60.0%;width:12.2%;height:19%;
  transform:translate(-50%,-50%);z-index:3;
  display:flex;align-items:center;justify-content:center;
  color:#071b51;font-weight:900;font-style:italic;
  font-size:clamp(15px,5.0vw,34px);line-height:1;
  white-space:nowrap;text-shadow:0 1px 1px rgba(255,255,255,.7);
  font-variant-numeric:tabular-nums;
}
.time-value.pop,.draw-number.pop{animation:valuePop .55s cubic-bezier(.2,.8,.3,1)}
.status{
  position:absolute;z-index:5;left:50%;bottom:2px;transform:translateX(-50%);
  display:none;padding:2px 7px;border-radius:20px;
  background:rgba(0,10,45,.82);color:#fff;font-size:8px;white-space:nowrap;
}
@keyframes bannerFloat{
  0%,100%{transform:translateY(0) rotateX(0deg);filter:brightness(1)}
  50%{transform:translateY(-1px) rotateX(.8deg);filter:brightness(1.035)}
}
@keyframes valuePop{
  0%{opacity:.35;transform:translate(-50%,-50%) scale(.78);filter:blur(3px)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1.08);filter:blur(0)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@media(prefers-reduced-motion:reduce){
  .timer-banner{animation:none}
  .time-value.pop,.draw-number.pop{animation:none}
}
</style>
</head>

  <div class="time-screen" id="screenHour">
   <div class="time-value" id="hours">--</div>
   <div class="time-label">HR</div>
  </div>
  <div class="time-screen" id="screenMinute">
   <div class="time-value" id="minutes">--</div>
   <div class="time-label">MIN</div>
  </div>
  <div class="time-screen" id="screenSecond">
   <div class="time-value" id="seconds">--</div>
   <div class="time-label">SEC</div>
  </div>

  <div class="draw-number-cover" aria-hidden="true"></div>
  <div class="draw-number" id="drawNumber">----</div>
  <div class="status" id="status"></div>
 </div>
</div>

<script>
"use strict";

const API_BASE_URL="https://glo365.onrender.com/api";
const SETTINGS_API=API_BASE_URL+"/public/daily-millionaire-settings";

const hourEl=document.getElementById("hours");
const minuteEl=document.getElementById("minutes");
const secondEl=document.getElementById("seconds");
const drawEl=document.getElementById("drawNumber");
const statusEl=document.getElementById("status");

let targetDrawTime=null;
let lastDrawNumber="";
let refreshTimer=null;
let countdownTimer=null;
let lastDisplayed={hours:"",minutes:"",seconds:""};

function animateValue(el){
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
}

function parseSettings(payload){
  const draw=payload?.draw || payload?.data?.draw || {};
  const settings=payload?.drawSettings || payload?.data?.drawSettings || {};
  const drawAt=draw.draw_at || draw.drawAt || settings.drawAt ||
               settings.draw_at || payload?.draw_at || payload?.drawAt;
  const drawNumber=draw.draw_number || draw.drawNumber ||
                   settings.drawNumber || settings.draw_number ||
                   payload?.draw_number || payload?.drawNumber;
  if(!drawAt) return null;
  const timestamp=Date.parse(drawAt);
  if(!Number.isFinite(timestamp)) return null;
  return {timestamp,drawNumber:drawNumber==null?"":String(drawNumber)};
}

async function loadTimerSettings(){
  try{
    const response=await fetch(SETTINGS_API,{
      method:"GET",
      headers:{"Accept":"application/json"},
      credentials:"include",
      cache:"no-store"
    });
    if(!response.ok) throw new Error("Timer API request failed ("+response.status+")");
    const payload=await response.json();
    const parsed=parseSettings(payload);
    if(!parsed) throw new Error("No valid draw_at/draw_number in settings response");

    targetDrawTime=parsed.timestamp;
    if(parsed.drawNumber && parsed.drawNumber!==lastDrawNumber){
      drawEl.textContent=parsed.drawNumber;
      lastDrawNumber=parsed.drawNumber;
      animateValue(drawEl);
    }
    statusEl.style.display="none";
    updateCountdown();
  }catch(error){
    console.error("Daily Millionaire timer:",error);
    if(!targetDrawTime){
      statusEl.textContent="Timer temporarily unavailable";
      statusEl.style.display="block";
    }
  }
}

function setTimeValue(el,key,value){
  if(lastDisplayed[key]!==value){
    el.textContent=value;
    lastDisplayed[key]=value;
    animateValue(el);
  }
}

function updateCountdown(){
  if(!targetDrawTime) return;
  const remaining=Math.max(0,targetDrawTime-Date.now());
  const totalSeconds=Math.floor(remaining/1000);
  const hours=String(Math.floor(totalSeconds/3600)).padStart(2,"0");
  const minutes=String(Math.floor((totalSeconds%3600)/60)).padStart(2,"0");
  const seconds=String(totalSeconds%60).padStart(2,"0");
  setTimeValue(hourEl,"hours",hours);
  setTimeValue(minuteEl,"minutes",minutes);
  setTimeValue(secondEl,"seconds",seconds);
}

function stopTimers(){
  if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}
  if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}
}
function startTimers(){
  stopTimers();
  if(document.hidden) return;
  loadTimerSettings();
  refreshTimer=setInterval(loadTimerSettings,60000);
  countdownTimer=setInterval(updateCountdown,1000);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) stopTimers();
  else startTimers();
});
startTimers();
</script>
