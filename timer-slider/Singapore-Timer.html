
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Singapore Pools Timer - GLO 365</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 font-family:Arial,Helvetica,sans-serif;
 background:transparent;
}

body{overflow:hidden}

.draw-board{
 width:calc(100% - 16px);
 height:132px;
 margin:1px 8px 4px;
 display:grid;
 grid-template-columns:1.15fr .88fr 1.35fr;
 gap:5px;
 align-items:stretch;
}

.official-box{
 min-width:0;
 height:132px;
 border-radius:15px;
 overflow:hidden;
 background:linear-gradient(145deg,#0755a5,#1688df);
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 text-decoration:none;
 color:#fff;
 text-align:center;
 border:1px solid #c6e3f8;
}

.official-art{
 flex:1;
 min-height:0;
 display:grid;
 place-items:center;
 background:radial-gradient(circle at 50% 45%,#a9ddff 0,#1688df 35%,#0755a5 78%);
 padding:5px;
}

.logo-wrap{
 width:82px;
 height:82px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}

.logo-top{
 color:#fff;
 font-size:10px;
 font-weight:900;
 letter-spacing:1px;
 margin-bottom:2px;
}

.logo-icon{
 width:64px;
 height:58px;
 background:linear-gradient(135deg,#087ac4,#07539a);
 border:2px solid #d7efff;
 border-radius:3px;
 display:grid;
 place-items:center;
 box-shadow:0 3px 7px #002e6380;
}

.logo-icon svg{
 width:54px;
 height:52px;
}

.logo-bottom{
 color:#fff;
 font-size:10px;
 font-weight:900;
 letter-spacing:5px;
 margin-top:3px;
 padding-left:5px;
}

.official-label{
 background:#0874c5;
 padding:5px 1px;
 font-size:clamp(9px,2.5vw,14px);
 line-height:1.1;
 font-weight:bold;
}

.days-box{
 min-width:0;
 height:132px;
 border-radius:15px;
 background:#1688df;
 color:#fff;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:3px 1px;
}

.days-number{
 font-size:clamp(25px,6vw,35px);
 font-weight:400;
 line-height:1;
}

.days-label{
 font-size:clamp(10px,2.7vw,15px);
 white-space:nowrap;
 margin-top:3px;
}

.draw-info{
 min-width:0;
 height:132px;
 display:flex;
 flex-direction:column;
 gap:4px;
}

.draw-number{
 background:#fff;
 border-radius:30px;
 padding:5px 2px;
 text-align:center;
 color:#1976b9;
 font-size:clamp(9px,2.4vw,13px);
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 border:1px solid #d8eaf8;
}

.time-row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:3px;
 flex:1;
 min-height:0;
}

.time-box{
 display:grid;
 grid-template-columns:1fr auto;
 align-items:center;
 overflow:hidden;
 border-radius:13px;
 background:#1688df;
 color:#fff;
 min-width:0;
}

.time-value{
 text-align:center;
 font-size:clamp(14px,3.6vw,21px);
 padding:3px 1px;
 font-variant-numeric:tabular-nums;
}

.time-label{
 background:#0874c5;
 height:100%;
 display:grid;
 place-items:center;
 padding:1px;
 font-size:clamp(7px,1.9vw,10px);
}

.draw-status{
 grid-column:1/-1;
 text-align:center;
 color:#0874c5;
 font-size:8px;
 font-weight:bold;
 padding:0;
 line-height:1.05;
}

@media(max-width:380px){

 .draw-board{
  width:calc(100% - 10px);
  margin-left:5px;
  margin-right:5px;
  grid-template-columns:1fr .75fr 1.2fr;
 }

 .official-label{font-size:9px}
 .days-number{font-size:25px}
 .days-label{font-size:10px}
 .draw-number{font-size:8px}
 .time-value{font-size:14px}
 .time-label{font-size:7px}
 .draw-status{font-size:7px}

}
</style>
</head>

<body>

<section class="draw-board">

 <div class="official-box">

  <div class="official-art">

   <div class="logo-wrap">

    <div class="logo-top">SINGAPORE</div>

    <div class="logo-icon">

     <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

      <path d="M78 13H31C12 13 10 39 29 44L67 54C82 58 78 76 62 76H19"
       fill="none"
       stroke="#fff"
       stroke-width="15"
       stroke-linecap="square"
       stroke-linejoin="round"/>

      <path d="M19 76L12 91"
       fill="none"
       stroke="#fff"
       stroke-width="13"/>

     </svg>

    </div>

    <div class="logo-bottom">POOLS</div>

   </div>

  </div>

  <div class="official-label">Singapore Pools</div>

 </div>

 <div class="days-box">

  <div class="days-number" id="countDays">--</div>

  <div class="days-label">– Days –</div>

 </div>

 <div class="draw-info">

  <div class="draw-number" id="drawNumber">
   Draw #: --
  </div>

  <div class="time-row">

   <div class="time-box">

    <span class="time-value" id="countHours">--</span>

    <span class="time-label">HR</span>

   </div>

   <div class="time-box">

    <span class="time-value" id="countMinutes">--</span>

    <span class="time-label">MIN</span>

   </div>

  </div>

  <div class="draw-status" id="drawScheduleStatus">
   Loading schedule...
  </div>

 </div>

</section>

<script>
"use strict";

const API_BASE_URL="https://glo365.onrender.com/api";

/* Singapore Timer uses 2D by default */
const currentGame="2D";

let currentSettings=null;

const $=id=>document.getElementById(id);

async function apiRequest(path){

 const response=await fetch(API_BASE_URL+path,{
  method:"GET",
  headers:{"Accept":"application/json"},
  credentials:"include",
  cache:"no-store"
 });

 let data={};

 try{
  data=await response.json();
 }catch(e){}

 if(!response.ok){
  throw new Error(
   data.message||data.error||"Request failed"
  );
 }

 return data;
}

function setText(id,value){

 const element=$(id);

 if(element){
  element.textContent=value;
 }

}

function parseDate(value){

 if(!value)return null;

 const date=new Date(value);

 return Number.isNaN(date.getTime())?null:date;

}

async function loadSettings(){

 try{

  const data=await apiRequest(
   "/singapore/settings/"+currentGame
  );

  if(!data.success||!data.settings){
   throw new Error("Draw not scheduled");
  }

  currentSettings=data.settings;

  updateCountdown();

 }catch(error){

  console.error("Singapore timer error:",error);

  currentSettings=null;

  setText("countDays","--");
  setText("countHours","--");
  setText("countMinutes","--");
  setText("drawNumber","Draw #: --");
  setText("drawScheduleStatus","Schedule unavailable");

 }

}

function updateCountdown(){

 if(!currentSettings)return;

 const settings=currentSettings;

 const drawAt=parseDate(settings.draw_at);

 setText(
  "drawNumber",
  "Draw #: "+(settings.draw_number||"--")
 );

 if(!drawAt){

  setText("countDays","--");
  setText("countHours","--");
  setText("countMinutes","--");
  setText("drawScheduleStatus","No draw scheduled");

  return;

 }

 const remaining=drawAt.getTime()-Date.now();

 if(remaining<=0){

  setText("countDays","0");
  setText("countHours","00");
  setText("countMinutes","00");
  setText("drawScheduleStatus","DRAW TIME REACHED");

  return;

 }

 const total=Math.floor(remaining/1000);

 const days=Math.floor(total/86400);

 const hours=Math.floor((total%86400)/3600);

 const minutes=Math.floor((total%3600)/60);

 setText("countDays",days);

 setText(
  "countHours",
  String(hours).padStart(2,"0")
 );

 setText(
  "countMinutes",
  String(minutes).padStart(2,"0")
 );

 const locked=
  settings.betting_locked===true ||
  settings.betting_enabled!==true ||
  remaining<=45*60*1000;

 setText(
  "drawScheduleStatus",
  locked?"BETTING CLOSED":"NEXT DRAW SCHEDULED"
 );

}

/* Initial settings load */
loadSettings();

/* Update countdown every second */
setInterval(updateCountdown,1000);

/* Refresh draw settings every minute */
setInterval(loadSettings,60000);

/* Refresh when user returns to the page */
document.addEventListener("visibilitychange",()=>{

 if(!document.hidden){
  loadSettings();
 }

});

</script>

</body>
</html>
