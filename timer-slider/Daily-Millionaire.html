<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Daily Millionaire Result - GLO 365</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:140px;min-height:140px;overflow:hidden;
  background:transparent;font-family:Arial,Helvetica,sans-serif;
}
.result-area{
  display:block;width:100%;height:140px;overflow:hidden;perspective:1100px;
}
.banner{
  position:relative;display:block;width:100%;height:140px;aspect-ratio:auto;
  flex:none;overflow:hidden;transform-style:preserve-3d;
  border-radius:12px;isolation:isolate;
  animation:bannerFloat 4.8s ease-in-out infinite;
  box-shadow:0 5px 15px rgba(0,35,110,.20);
}
.banner-image{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;object-fit:fill;pointer-events:none;
}

/* Cover the printed sample draw number, keeping the original gold capsule edge */
.draw-cover{
  position:absolute;left:65.5%;top:15.6%;width:32.0%;height:12.8%;
  transform:translate(-50%,-50%);z-index:2;border-radius:999px;
  background:linear-gradient(180deg,#fff2a0 0%,#ffd84b 23%,#ffb900 58%,#e98b00 100%);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.85),
             inset 0 -3px 4px rgba(135,65,0,.28),
             0 1px 2px rgba(0,0,0,.18);
}
.draw-number{
  position:absolute;left:65.5%;top:15.6%;width:31.0%;height:12.5%;
  transform:translate(-50%,-50%);z-index:3;
  display:flex;align-items:center;justify-content:center;
  color:#080808;font-weight:900;font-size:clamp(10px,3.35vw,23px);
  line-height:1;white-space:nowrap;letter-spacing:0;
  text-shadow:0 1px 1px rgba(255,255,255,.55);
  pointer-events:none;
}

/* Glossy ball faces cover the sample digits printed in the source artwork.
   The gold rims and the rest of the original image remain untouched. */
.ball-face{
  position:absolute;top:53.5%;width:11.0%;aspect-ratio:1;
  transform:translate(-50%,-50%);z-index:2;border-radius:50%;
  background:
    radial-gradient(ellipse at 34% 22%,rgba(255,255,255,.98) 0 8%,rgba(255,255,255,.62) 18%,transparent 39%),
    radial-gradient(ellipse at 52% 43%,#ffffff 0%,#f5f7ff 42%,#dce5ff 72%,#b8c9f4 100%);
  box-shadow:inset 0 5px 9px rgba(255,255,255,.82),
             inset 0 -8px 12px rgba(50,78,160,.16),
             0 0 5px rgba(255,255,255,.35);
}
#face1{left:50.8%}
#face2{left:65.6%}
#face3{left:80.6%}

.digit{
  position:absolute;top:53.5%;width:11.0%;aspect-ratio:1;
  transform:translate(-50%,-50%);z-index:4;
  display:flex;align-items:center;justify-content:center;
  color:#071b51;font-weight:900;font-size:clamp(22px,8.0vw,55px);
  line-height:1;text-shadow:0 2px 1px rgba(255,255,255,.9),
                          0 3px 5px rgba(0,0,50,.16);
  pointer-events:none;
}
#digit1{left:50.8%}
#digit2{left:65.6%}
#digit3{left:80.6%}

.digit.pop{animation:numberPop .65s cubic-bezier(.2,.8,.3,1)}
.draw-number.pop{animation:drawPop .55s cubic-bezier(.2,.8,.3,1)}

@keyframes bannerFloat{
  0%,100%{transform:translateY(0) rotateX(0deg);filter:brightness(1)}
  50%{transform:translateY(-1px) rotateX(.8deg);filter:brightness(1.035)}
}
@keyframes numberPop{
  0%{opacity:.2;transform:translate(-50%,-50%) scale(.55);filter:blur(4px)}
  65%{opacity:1;transform:translate(-50%,-50%) scale(1.12);filter:blur(0)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes drawPop{
  0%{opacity:.3;transform:translate(-50%,-50%) scale(.82)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.status{
  position:absolute;z-index:5;left:50%;bottom:2px;transform:translateX(-50%);
  display:none;padding:2px 7px;border-radius:20px;
  background:rgba(0,10,45,.82);color:#fff;font-size:8px;white-space:nowrap;
}
@media(max-width:380px){
  .draw-number{font-size:clamp(9px,3.0vw,15px)}
}
@media(prefers-reduced-motion:reduce){
  .banner{animation:none}
  .digit.pop,.draw-number.pop{animation:none}
}
</style>
</head>

    <div class="ball-face" id="face3" aria-hidden="true"></div>

    <div class="digit" id="digit2">—</div>
    <div class="digit" id="digit3">—</div>

<script>
"use strict";

/* Exact GLO 365 API configuration and response normalization from home.html */
const API_BASE_URL = "https://glo365.onrender.com/api";
const RESULT_API_PATH = "/public/daily-millionaire/result";

const digitElements = [
  document.getElementById("digit1"),
  document.getElementById("digit2"),
  document.getElementById("digit3")
];
const drawNumberElement = document.getElementById("drawNumber");
const statusElement = document.getElementById("status");

let lastResult = "";
let lastDrawNumber = "";

function normalizeMillionaireResult(response){
  if(!response || typeof response !== "object") return null;

  const row = response.result || response.latestResult ||
    (Array.isArray(response.results) ? response.results[0] : null);

  if(!row || typeof row !== "object") return null;

  let value = row.result ?? row.number ?? row.winning_number ?? row.winningNumber;

  if(value && typeof value === "object"){
    value = value.number ?? value.result ?? value.value ?? null;
  }

  if(value === null || value === undefined || String(value).trim() === "") return null;

  const number = String(value).trim();
  if(!/^\d{3}$/.test(number)) return null;

  return {
    number,
    drawNumber:String(row.draw_number || row.drawNumber || ""),
    drawDate:String(row.draw_date || row.drawDate || ""),
    publishedAt:row.published_at || row.publishedAt || null
  };
}

function animateElement(element,className){
  element.classList.remove(className);
  void element.offsetWidth;
  element.classList.add(className);
}

function showMillionaireResult(result){
  if(!result) return;

  if(result.number !== lastResult){
    const digits = result.number.split("");
    digitElements.forEach((element,index)=>{
      element.textContent = digits[index];
      animateElement(element,"pop");
    });
    lastResult = result.number;
  }

  if(result.drawNumber && result.drawNumber !== lastDrawNumber){
    drawNumberElement.textContent = "DRAW NO: " + result.drawNumber;
    animateElement(drawNumberElement,"pop");
    lastDrawNumber = result.drawNumber;
  }
}

async function loadMillionaireResult(){
  try{
    const response = await fetch(API_BASE_URL + RESULT_API_PATH,{
      method:"GET",
      headers:{"Accept":"application/json"},
      credentials:"include",
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("Result API request failed (" + response.status + ")");
    }

    const data = await response.json();
    const result = normalizeMillionaireResult(data);

    if(!result){
      throw new Error("No valid published result in API response");
    }

    showMillionaireResult(result);
    statusElement.style.display = "none";
  }catch(error){
    console.error("Daily Millionaire result:",error);
    if(!lastResult){
      statusElement.textContent = "Result temporarily unavailable";
      statusElement.style.display = "block";
    }
  }
}

let refreshTimer = null;

function startRefresh(){
  stopRefresh();
  if(document.hidden) return;
  loadMillionaireResult();
  refreshTimer = setInterval(loadMillionaireResult,60000);
}

function stopRefresh(){
  if(refreshTimer){
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden) stopRefresh();
  else startRefresh();
});

startRefresh();
</script>
